name: Gate 01.5 isolated outbox evidence
on:
  push:
    branches: [messenger-architecture-1.0]
    paths: ['gates/gate-01-5-outbox/**', '.github/workflows/gate015-outbox-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  outbox-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original Gate 01.4 served-source snapshot from its successful run
        uses: actions/download-artifact@v4
        with:
          name: gate014-live-ui-and-hosted-source
          run-id: 34161167177
          github-token: ${{ github.token }}
          path: parent-snapshot
      - run: mkdir -p gates/gate-01-5-outbox/base && cp parent-snapshot/live/site/* gates/gate-01-5-outbox/base/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Build from verified predecessor into isolated test directory
        run: python gates/gate-01-5-outbox/build.py
      - name: Queue transaction, actual reload, process restart, offline enqueue and negative controls
        run: python gates/gate-01-5-outbox/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate015-outbox-evidence-and-source
          path: |
            evidence/gate015/
            gates/gate-01-5-outbox/
          retention-days: 14
