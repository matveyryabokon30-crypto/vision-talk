name: Pablicus RC5 passkey login and recovery
on:
  push:
    branches: [pablicus-rc2-release]
    paths: ['apps/pablicus/**', '.github/workflows/pablicus-rc5-simple-login-release.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: pablicus-publication
  cancel-in-progress: false
jobs:
  checked-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify required assets and syntax
        working-directory: source
        run: |
          python -m pip install playwright==1.55.0 pillow==11.3.0
          python apps/pablicus/build.py
          python apps/pablicus/finalize.py
          for f in apps/pablicus/dist/*.js; do node --check "$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('apps/pablicus/dist');a=(d/'app.js').read_text();h=(d/'index.html').read_text()
          assert json.loads((d/'version.json').read_text())['version']=='0.1.0-rc5'
          assert 'PablicusLogin.mount' in a and 'auth-local.js' in h
          assert 'PablicusPasskeys.create' in a and 'passkey-login.js' in h
          assert 'shouldCreateUser:false' in (d/'auth-local.js').read_text()
          assert 'pablicus-auth-handoff' not in a and 'Ссылка отправлена.' not in a
          assert '__ASSET_REVISION__' not in (d/'sw.js').read_text()
          PY
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const context = {};
          vm.runInNewContext(fs.readFileSync('apps/pablicus/dist/auth-config.js', 'utf8'), context);
          const config = context.PablicusAuthConfig;
          assert.equal(config.passkeys.enabled, true);
          assert.equal(config.passkeys.rpId, 'matveyryabokon30-crypto.github.io');
          assert.equal(config.passkeys.origin, 'https://matveyryabokon30-crypto.github.io');
          assert.equal(config.publicPasskey.enabled, true);
          assert.equal(config.publicPasskey.origin, 'https://matveyryabokon30-crypto.github.io');
          assert.equal(config.publicSignupReady, false);
          assert.ok(Object.values(config.providers).every(enabled => enabled === false));
          JS
      - name: Install pinned public passkey verifier and test dependencies
        working-directory: source
        run: |
          npm ci --ignore-scripts --prefix apps/pablicus/public-passkey
          npm ci --ignore-scripts --prefix apps/pablicus/chat-workspace
      - name: Rich message database authorization and atomic publication
        working-directory: source
        run: npm test --prefix apps/pablicus/chat-workspace
      - name: Verify vendored SDK and authentication module contracts
        working-directory: source
        run: |
          python apps/pablicus/vendor/verify-supabase.py
          node --test apps/pablicus/tests/oauth_module.test.js apps/pablicus/tests/passkey_module.test.js apps/pablicus/tests/public_passkey_module.test.js apps/pablicus/public-access/yandex-userinfo/handler.test.mjs
          node --test apps/pablicus/tests/rich_message_module.test.js
      - name: Install browser engines
        run: python -m playwright install --with-deps chromium webkit
      - name: Focused voice playback and integrated chat actions in both browser engines
        working-directory: source
        run: |
          python apps/pablicus/tests/voice_design.py chromium
          python apps/pablicus/tests/voice_design.py webkit
          python apps/pablicus/tests/chat_polish.py
      - name: Public first-key page with virtual WebAuthn and mocked provider HTTP
        working-directory: source
        run: python apps/pablicus/tests/public_passkey_page.py
      - name: Public passkey full-app admission and existing-account identity preservation with mocked Auth HTTP
        working-directory: source
        run: python apps/pablicus/tests/public_passkey_app.py
      - name: Native WebAuthn enrollment and sign-in with virtual authenticator and mocked Auth HTTP
        working-directory: source
        run: python apps/pablicus/tests/passkey_login.py
      - name: OAuth callback and browser isolation with mocked Auth HTTP
        working-directory: source
        run: python apps/pablicus/tests/oauth_login.py
      - name: Isolated stores and Auth proof checks with explicit mocked Auth HTTP
        working-directory: source
        run: python apps/pablicus/tests/auth_local.py
      - name: Legacy-mode password login, recovery callback and self-service password checks
        working-directory: source
        run: python apps/pablicus/tests/access_setup.py
      - name: Affected initialization and existing chat outbox regression with mock backend
        working-directory: source
        run: python apps/pablicus/tests/run_isolated.py
      - name: Ordered rich draft durability and one-message delivery with mock transport and microphone
        working-directory: source
        run: |
          python apps/pablicus/tests/rich_store.py
          python apps/pablicus/tests/rich_message_integration.py
          python apps/pablicus/tests/message_interactions.py
          python apps/pablicus/tests/inbox_monitor.py
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publication
      - name: Promote only tested static Pablicus subdirectory, preserve root and data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh api repos/${{ github.repository }}/pages > evidence/pages-before.json
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          cfg=json.loads(Path('evidence/pages-before.json').read_text())
          assert cfg['build_type']=='legacy' and cfg['source']=={'branch':'main','path':'/'}
          root=Path('publication')
          before={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file() and '.git' not in f.parts and not str(f.relative_to(root)).startswith('pablicus/')}
          shutil.rmtree(root/'pablicus',ignore_errors=True);shutil.copytree('source/apps/pablicus/dist',root/'pablicus')
          for n,h in before.items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h,n
          Path('evidence/root-preserved.json').write_text(json.dumps({'files':len(before),'pass':True}))
          PY
          cd publication
          git config user.name 'Pablicus release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pablicus
          if ! git diff --cached --quiet; then git commit -m 'Publish checked Pablicus RC5 passkey login and recovery'; git push origin HEAD:main; fi
          git rev-parse HEAD > ../evidence/publication-commit.txt
          gh api -X POST repos/${{ github.repository }}/pages/builds > ../evidence/pages-build.json
      - name: Confirm all published bytes over stable HTTPS and live unauthenticated launch
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,time,urllib.request
          from pathlib import Path
          from playwright.async_api import async_playwright
          url='https://matveyryabokon30-crypto.github.io/vision-talk/pablicus/';d=Path('source/apps/pablicus/dist');expected=json.loads((d/'version.json').read_text())
          for _ in range(36):
            try:
              actual=json.load(urllib.request.urlopen(url+'version.json?verify='+str(time.time()),timeout=10))
              if actual.get('asset_revision')==expected['asset_revision']:break
            except Exception:pass
            time.sleep(5)
          else:raise RuntimeError('Checked RC5 not reachable within bounded publication wait')
          files=[]
          for f in sorted(d.rglob('*')):
            if not f.is_file():continue
            n=str(f.relative_to(d));data=urllib.request.urlopen(url+n+'?verify='+expected['asset_revision'],timeout=20).read()
            ok=hashlib.sha256(data).digest()==hashlib.sha256(f.read_bytes()).digest();assert ok,n
            files.append({'path':n,'sha256':hashlib.sha256(data).hexdigest(),'match':True})
          Path('evidence/live-bytes.json').write_text(json.dumps({'url':url,'version':expected,'files':files},indent=2))
          async def live():
            out=[]
            async with async_playwright() as p:
              for name in ['chromium','webkit']:
                b=await getattr(p,name).launch();c=await b.new_context(viewport={'width':440,'height':766},service_workers='block');page=await c.new_page();errors=[];passkey_requests=[];page.on('pageerror',lambda e:errors.append(str(e)))
                page.on('request',lambda request:passkey_requests.append(request.method) if '/auth/v1/passkeys' in request.url else None)
                await page.goto(url+'?release='+expected['asset_revision'],wait_until='domcontentloaded',timeout=40000)
                await page.wait_for_function('window.PablicusDebug?.version==="0.1.0-rc5"')
                for selector in ['#legacyLogin','#email','#password','#showLoginPassword','#loginSubmit','#recoverPassword','#emailLogin','#magicSubmit','#oauthLogin','#newChat']:assert not await page.locator(selector).is_visible(),selector
                assert await page.locator('#loginPane button:visible:not(#installLogin)').evaluate_all('buttons => buttons.map(button => button.id)')==['passkeySignIn']
                assert await page.evaluate('PablicusAuthConfig.passkeys.enabled === true')
                assert await page.evaluate('PablicusAuthConfig.publicPasskey.enabled === true && PablicusAuthConfig.publicPasskey.origin === location.origin')
                supported=await page.evaluate('PablicusPasskeys.support().supported')
                assert await page.locator('#passkeySignIn').is_visible()
                assert await page.locator('#passkeySignIn').is_enabled()==supported
                assert await page.locator('#passkeySignIn').inner_text()=='Войти с ключом доступа'
                if not supported:assert 'Safari' in await page.locator('#passkeyLoginStatus').inner_text()
                assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                assert await page.locator('#loginPane').is_visible()
                assert not await page.locator('#workspace').is_visible()
                assert not errors,errors
                assert not passkey_requests,passkey_requests
                await page.screenshot(path='evidence/'+name+'-rc5-live.png')
                out.append({'engine':name,'online_login_screen':'PASS','key_only_login':True,'legacy_login_fields_visible':False,'passkey_button_visible':True,'passkey_button_enabled':supported,'automatic_passkey_requests':0,'real_passkey_ceremony':'NOT_TESTED','real_email_verification':'NOT_TESTED','physical_iPhone':False});await b.close()
            Path('evidence/live-launch.json').write_text(json.dumps(out,indent=2))
          asyncio.run(live())
          print('PABLICUS_RC5_LIVE_CHECKED',url,expected)
          PY
      - name: Preserve candidate source and scoped evidence
        if: always()
        run: |
          mkdir -p evidence
          cd source
          git rev-parse HEAD > ../evidence/source-commit.txt
          git archive HEAD > ../evidence/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pablicus-rc5-auth-checked
          path: |
            evidence/
            source/apps/pablicus/evidence/
            source/apps/pablicus/dist/
          retention-days: 14
