name: Publish Pablicus rc3 passwordless login
on:
  push:
    branches: [pablicus-rc2-release]
    paths:
      - apps/pablicus/src/home.html
      - apps/pablicus/src/app.js
      - apps/pablicus/build.py
      - .github/workflows/pablicus-rc3-passwordless-release.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: pablicus-stable-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pablicus-rc2-release
          path: source
      - name: Build rc3 and assert closed passwordless auth
        run: |
          cd source
          python apps/pablicus/build.py
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path('apps/pablicus/dist')
          v=json.loads((d/'version.json').read_text())
          assert v['version']=='0.1.0-rc3'
          html=(d/'index.html').read_text()
          app=(d/'app.js').read_text()
          assert 'Получить ссылку для входа' in html
          assert "shouldCreateUser:false" in app
          assert 'detectSessionInUrl:true' in app
          assert 'signInWithOtp' in app
          assert 'signUp(' not in app
          print('PASSWORDLESS_CLOSED_AUTH_BUILD_PASS')
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publication
          fetch-depth: 1
      - name: Replace only Pablicus subdirectory
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('publication')
          old={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file() and '.git' not in f.parts and not str(f.relative_to(root)).startswith('pablicus/')}
          Path('/tmp/root-hashes.json').write_text(json.dumps(old))
          PY
          rm -rf publication/pablicus
          mkdir -p publication/pablicus
          cp -a source/apps/pablicus/dist/. publication/pablicus/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('publication'); old=json.loads(Path('/tmp/root-hashes.json').read_text())
          for name,digest in old.items():
            assert (root/name).exists(),name
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          PY
          cd publication
          git config user.name 'Pablicus release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pablicus
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Pablicus 0.1.0-rc3 passwordless login'
            git push origin HEAD:main
          fi
      - name: Verify stable HTTPS address serves rc3
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url='https://matveyryabokon30-crypto.github.io/vision-talk/pablicus/version.json'
          for _ in range(36):
            try:
              v=json.load(urllib.request.urlopen(url+'?t='+str(time.time()),timeout=15))
              if v.get('version')=='0.1.0-rc3':
                print('PABLICUS_RC3_LIVE',v);break
            except Exception:pass
            time.sleep(5)
          else: raise RuntimeError('rc3 was not visible on stable HTTPS URL in bounded wait')
          PY