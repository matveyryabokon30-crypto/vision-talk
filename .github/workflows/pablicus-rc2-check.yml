name: Pablicus RC2 build and browser checks
on:
  push:
    branches: [pablicus-rc2-release]
    paths: ['apps/pablicus/**', '.github/workflows/pablicus-rc2-check.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, apply lifecycle fix, fingerprint and validate artifact
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python apps/pablicus/build.py
          python apps/pablicus/finalize.py
          for f in apps/pablicus/dist/*.js; do node --check "$f"; done
      - name: Install test browser engines
        run: |
          # The hosted image can expose a stale Google Chrome apt index. Playwright
          # does not need that third-party source for its pinned browser bundles.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*chrome*' -delete
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          python -m playwright install --with-deps chromium webkit
      - name: Browser integration in disposable copy; verify release hashes unchanged
        run: python apps/pablicus/tests/run_isolated.py
      - name: Archive exact candidate and evidence
        if: always()
        run: |
          mkdir -p evidence
          git archive HEAD > evidence/source.tar
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pablicus-rc2-checked-candidate
          path: |
            apps/pablicus/dist/
            apps/pablicus/evidence/
            evidence/
          retention-days: 14
