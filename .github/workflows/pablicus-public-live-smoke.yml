name: Pablicus published browser smoke
on:
  push:
    branches: [pablicus-rc2-release]
    paths: [.github/workflows/pablicus-public-live-smoke.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0 pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Read-only checks against published site and backend
        run: |
          mkdir -p live-evidence
          cat > /tmp/live.py <<'PY'
          import asyncio,io,json,urllib.request,urllib.error
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright
          SITE='https://matveyryabokon30-crypto.github.io/vision-talk/pablicus/'
          E=Path('live-evidence');out=[]
          async def main():
            async with async_playwright() as p:
              for engine in ['chromium','webkit']:
                checks=[];errors=[];b=await getattr(p,engine).launch()
                c=await b.new_context(viewport={'width':440,'height':766})
                page=await c.new_page();page.on('pageerror',lambda e:errors.append(str(e)))
                r=await page.goto(SITE,wait_until='networkidle',timeout=40000)
                assert r.status==200
                await page.wait_for_function('window.PablicusDebug?.version==="0.1.0-rc2"',timeout=15000)
                assert await page.locator('#loginPane').is_visible()
                checks.append('Published application loads, JS starts, existing-account login displayed')
                assert await page.locator('#email').is_visible() and await page.locator('#password').is_visible()
                assert not await page.locator('#mainNav').is_visible()
                checks.append('Unauthenticated session shows no private workspace')
                await page.locator('#installLogin').click()
                assert await page.locator('#productDialog').is_visible()
                assert 'Safari' in await page.locator('#dialogContent').inner_text()
                await page.locator('#dialogClose').click()
                checks.append('Installation guidance opens inside app')
                await page.evaluate('navigator.serviceWorker.ready.then(()=>true)')
                await page.reload(wait_until='networkidle')
                scope=await page.evaluate('navigator.serviceWorker.getRegistration().then(r=>r.scope)')
                assert scope==SITE
                cache_urls=await page.evaluate('(async()=>{let u=[];for(const k of await caches.keys())for(const r of await(await caches.open(k)).keys())u.push(r.url);return u})()')
                assert all(u.startswith(SITE) for u in cache_urls)
                checks.append('Scoped service worker contains public static resources only')
                await c.set_offline(True);await page.reload(wait_until='domcontentloaded')
                await page.wait_for_function('window.PablicusDebug?.version==="0.1.0-rc2"',timeout=15000)
                assert await page.locator('#loginPane').is_visible()
                assert await page.locator('#connection').is_visible()
                checks.append('Public shell restarts offline with explicit no-network status')
                await c.set_offline(False)
                await page.screenshot(path=str(E/(engine+'-live-login.png')))
                await page.set_viewport_size({'width':1280,'height':800})
                assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                checks.append('Desktop viewport has no horizontal page overflow')
                assert not errors,errors
                checks.append('No JavaScript errors')
                out.append({'engine':engine,'pass':True,'checks':checks,'physical_iPhone':False,'two_account_exchange':'NOT_TESTED','scope':scope})
                await b.close()
          try:asyncio.run(main())
          finally:E.joinpath('browser-smoke.json').write_text(json.dumps(out,indent=2))
          manifest=json.load(urllib.request.urlopen(SITE+'manifest.webmanifest'))
          assert manifest['name']=='Pablicus' and manifest['display']=='standalone' and manifest['id']=='./' and manifest['scope']=='./'
          sizes={}
          for n in [180,192,512]:
            data=urllib.request.urlopen(SITE+f'assets/icon-{n}.png').read();size=Image.open(io.BytesIO(data)).size
            assert size==(n,n);sizes[str(n)]=size
          req=urllib.request.Request('https://ctcoqgsztdtsazdiwcmd.supabase.co/rest/v1/messages?select=id&limit=1',headers={'apikey':'sb_publishable_kMGqZAM2vadfXbBr8r5uzw_l9EiBtIw'})
          try:
            response=urllib.request.urlopen(req);data=json.load(response);assert data==[];anonymous='NO_ROWS'
          except urllib.error.HTTPError as e:
            assert e.code in [401,403];anonymous='DENIED_'+str(e.code)
          E.joinpath('manifest-and-privacy.json').write_text(json.dumps({'manifest':manifest,'icon_sizes':sizes,'anonymous_private_messages':anonymous,'pass':True},indent=2))
          print('PUBLISHED_READ_ONLY_BROWSER_SMOKE_PASS',json.dumps(out))
          PY
          python /tmp/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pablicus-public-live-smoke
          path: live-evidence/
          retention-days: 30
