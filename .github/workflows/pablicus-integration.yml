name: Pablicus integration 1C

on:
  push:
    branches: [refactor/pablicus-foundation-20260911]
    paths:
      - 'pablicus/**'
      - 'tests/engineering/block-01/**'
      - '.github/workflows/pablicus-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  INTEGRATION_1C_WORK_START_HEAD: 56a6ecf7b5ebdf0e8cc3529d4582707188124e29
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.7'
      - name: Capture exact tracked source and provenance before checks
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess
          out=pathlib.Path('integration-1c-results'); out.mkdir(exist_ok=True)
          prefixes=('pablicus/','tests/engineering/block-01/','docs/engineering/block-01/','docs/pablicus/','.github/workflows/')
          hashes={}
          for name in subprocess.check_output(['git','ls-files'],text=True,timeout=10).splitlines():
              if not (name.startswith(prefixes) or name in ['PABLICUS_CONTEXT.md','README.md']): continue
              source=pathlib.Path(name)
              if source.is_symlink(): raise RuntimeError('Unexpected symlink: '+name)
              b=source.read_bytes(); dest=out/'source'/name; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(b)
              hashes[name]={'sha256':hashlib.sha256(b).hexdigest(),'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()}
          data={'WORK_START_HEAD':os.environ['INTEGRATION_1C_WORK_START_HEAD'],'CAPTURE_SHA':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'python':platform.python_version(),'platform':platform.platform(),'node':subprocess.check_output(['node','--version'],text=True,timeout=5).strip(),'sources':hashes,'capture_phase':'BEFORE_CHECKS_NOT_A_VERDICT'}
          (out/'SOURCE_MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Install pinned isolated browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Validate integration harness syntax
        run: |
          python - <<'PY'
          import ast,pathlib
          for source in pathlib.Path('tests/engineering/block-01/integration_1c').glob('*.py'):
              ast.parse(source.read_text(),filename=str(source))
          PY
          timeout 5s node --check tests/engineering/block-01/integration_1c/instrument.js
      - name: Qualify harness and preflight before real browser scenarios
        run: |
          timeout --kill-after=5s 1800s python tests/engineering/block-01/integration_1c/runner.py --source-root . --output-dir integration-1c-results/browser > integration-1c-results/browser.log 2>&1
      - name: Qualify isolated resource, account, bytes and route negative controls
        run: |
          timeout --kill-after=5s 780s python tests/engineering/block-01/integration_1c/mutation_runner.py --source-root . --positive-results integration-1c-results/browser/results.json --output-dir integration-1c-results/negative-controls > integration-1c-results/negative-controls.log 2>&1
      - name: Preserve accepted 1B regressions
        run: |
          timeout --kill-after=5s 120s python tests/engineering/block-01/test_controller_1b.py --source-root . --output integration-1c-results/regression-1b.json
      - name: Verify no browser or driver process remains
        if: always()
        run: |
          python - <<'PY'
          import datetime,json,pathlib,platform,subprocess,sys
          rows=subprocess.check_output(['ps','-eo','pid=,ppid=,pgid=,stat=,args='],text=True,timeout=5).splitlines()
          observed=[]
          for row in rows:
              parts=row.split(None,4)
              if len(parts)!=5:continue
              command=parts[4]
              if '/.cache/ms-playwright/' not in command and '/site-packages/playwright/driver/node' not in command:continue
              observed.append({'pid':int(parts[0]),'ppid':int(parts[1]),'pgid':int(parts[2]),'state':parts[3],'command':command})
          active=[row for row in observed if not row['state'].startswith('Z')]
          result={'status':'PASS' if not active else 'ERROR','time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'platform':platform.platform(),'observed_playwright_processes':observed,'remaining_active_processes':active,'scope':'Fresh isolated CI job; Playwright browser and Python driver processes. Remaining processes invalidate qualification and are retained for GitHub runner cleanup.'}
          out=pathlib.Path('integration-1c-results');out.mkdir(exist_ok=True)
          (out/'PROCESS_CLEANUP.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result));sys.exit(0 if not active else 1)
          PY
      - name: Record integration scope
        if: always()
        run: |
          printf '%s\n' 'Real local index and SDK; real DOM/IndexedDB and application modules. Synthetic HTTP/Phoenix, no external forwarding; native IDB fault boundary. Static local shell supplied during offline reload; not production Service Worker or RLS qualification. Receiver/collector self-tests, A/B0/B1 and preflight gate positive scenarios. Negative controls run only after the positive baseline passes, followed by accepted 1B regressions. Individual evidence files determine results; this scope note grants no acceptance.' > integration-1c-results/BOUNDARY.txt
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: integration-1c-${{ github.sha }}
          path: integration-1c-results/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
