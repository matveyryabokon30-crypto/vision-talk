async function openDialog(d){if(!d)return;stop();currentConversation=d;lastSeq=0;peerRead=0;rendered.clear();activePreview=null;document.body.classList.add('chat');root.className='app chatRoot';root.innerHTML=`<div class="chatShell"><div class="chatTop"><button id="back" class="iconBtn">${icons.back}</button><div class="avatar">${esc((d.title||'?').replace('@','')[0]||'?').toUpperCase()}</div><div><div class="chatName">${esc(d.title||'Диалог')}</div><div class="presence">Vision Talk · ${VERSION}</div></div></div><div id="messages" class="messages"></div><div class="composer"><button id="attach" class="iconBtn">${icons.plus}</button><div class="pill"><input id="msg" class="msg" placeholder="Сообщение"><button id="cam" class="iconBtn">${icons.cam}</button></div><button id="send" class="iconBtn">${icons.mic}</button></div></div>`;ensureInputs();document.getElementById('back').onclick=dialogs;document.getElementById('attach').onclick=openSheet;document.getElementById('cam').onclick=()=>pick('cameraInput');const msg=document.getElementById('msg'),send=document.getElementById('send');msg.oninput=()=>{send.classList.toggle('ready',!!msg.value.trim());send.innerHTML=msg.value.trim()?icons.send:icons.mic};msg.onfocus=closeSheet;send.onclick=sendNow;await initialMessages();await markRead();await peer();pollTimer=setInterval(async()=>{if(!document.hidden&&currentConversation){await newMessages();await markRead();await peer();}},1300);try{channel=sb.channel('conversation-'+d.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+d.id},p=>appendMessages([p.new],true)).subscribe()}catch{}flush();processUploads()}
async function initialMessages(){const {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,type,body,attachment_path,attachment_metadata,created_at').eq('conversation_id',currentConversation.id).order('server_seq',{ascending:true});const box=document.getElementById('messages');if(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}box.textContent='';appendMessages(data||[],true);syncPending();bottom()}async function newMessages(){const {data}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,type,body,attachment_path,attachment_metadata,created_at').eq('conversation_id',currentConversation.id).gt('server_seq',lastSeq).order('server_seq',{ascending:true});if(data?.length)appendMessages(data,false)}async function markRead(){if(!currentConversation||!lastSeq||!navigator.onLine)return;await sb.rpc('mark_conversation_read',{p_conversation_id:currentConversation.id,p_last_read_seq:lastSeq})}async function peer(){if(!currentConversation)return;const {data}=await sb.from('conversation_members').select('last_read_seq').eq('conversation_id',currentConversation.id).neq('user_id',session.user.id).limit(1).maybeSingle();const v=Number(data?.last_read_seq||0);if(v!==peerRead){peerRead=v;document.querySelectorAll('.row.mine:not(.pending)').forEach(r=>{const s=r.querySelector('.seq'),n=Number(r.dataset.seq||0);if(s&&n)s.textContent=meta(n,true)});document.querySelectorAll('.mediaSeq').forEach(s=>{const r=s.closest('.row'),n=Number(r?.dataset.seq||0);if(n&&r?.classList.contains('mine'))s.textContent=meta(n,true)})}}
function appendMessages(list=[],force=false){const box=document.getElementById('messages');if(!box)return;const stick=force||nearBottom();let changed=false;for(const m of list){const key=m.client_message_id||m.id;if(rendered.has(key))continue;document.getElementById('p-'+key)?.remove();const isM=mine(m),r=document.createElement('div');r.className='row '+(isM?'mine':'')+(m.attachment_path?' mediaRow':'');r.dataset.seq=m.server_seq||0;const b=document.createElement('div');b.className='bubble'+(m.attachment_path?' mediaBubble':'');if(m.attachment_path)b.innerHTML=mediaMarkup(m,isM);else{b.appendChild(document.createTextNode(m.body||''));const s=document.createElement('span');s.className='seq';s.textContent=meta(m.server_seq,isM);b.appendChild(s)}r.appendChild(b);insertRow(r,m.server_seq);rendered.add(key);lastSeq=Math.max(lastSeq,Number(m.server_seq||0));changed=true;if(m.attachment_path)hydrateMedia(r,m)}if(changed&&stick)bottom();syncPending();setupPreviewAutoplay()}function mediaMarkup(m,isM){const mm=metaObj(m),name=mm.name||'Файл',seqHtml=`<span class="mediaSeq">${esc(meta(m.server_seq,isM))}</span>`;if(m.type==='image')return `<button class="photoFrame" data-frame data-kind="image" data-name="${esc(name)}">Загрузка…${seqHtml}</button>`;if(m.type==='video')return `<button class="videoFrame portrait" data-frame data-kind="video" data-name="${esc(name)}">Загрузка…<span class="videoLabel">Видео</span>${seqHtml}</button>`;return `<button class="docCard" data-frame data-kind="document" data-name="${esc(name)}"><div class="docIcon">${icons.file}</div><div><div class="docTitle">${esc(name)}</div><div class="docMeta">${esc(size(mm.size_bytes||0))}</div></div></button><div class="docFooter"><span>${esc(name)}</span><span>${esc(meta(m.server_seq,isM))}</span></div>`}
async function signed(path){const c=signedCache.get(path);if(c&&c.exp>Date.now())return c.url;const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);if(error)throw error;signedCache.set(path,{url:data.signedUrl,exp:Date.now()+50*60*1000});return data.signedUrl}
async function hydrateMedia(row,m){try{const url=await signed(m.attachment_path),frame=row.querySelector('[data-frame]'),name=metaObj(m).name||'Медиа';if(!frame)return;frame.dataset.url=url;if(m.type==='image')frame.innerHTML=`<img src="${esc(url)}" alt=""><span class="mediaSeq">${esc(meta(m.server_seq,mine(m)))}</span>`;else if(m.type==='video'){frame.innerHTML=`<video src="${esc(url)}" muted loop playsinline preload="metadata"></video><span class="videoLabel">Видео</span><span class="mediaSeq">${esc(meta(m.server_seq,mine(m)))}</span>`;const v=frame.querySelector('video');v.addEventListener('loadedmetadata',()=>{if(v.videoWidth>v.videoHeight)frame.classList.replace('portrait','landscape');tryStartOnePreview(v)},{once:true});setTimeout(()=>tryStartOnePreview(v),250)}else frame.onclick=()=>openViewer('document',url,name)}catch(e){const frame=row.querySelector('[data-frame]');if(frame)frame.outerHTML=`<div class="mediaErr">Не удалось открыть вложение<br><button class="retry">Повторить</button></div>`;row.querySelector('.retry')?.addEventListener('click',()=>hydrateMedia(row,m))}}
function setupPreviewAutoplay(){document.querySelectorAll('.videoFrame video').forEach(v=>{if(v.dataset.safeBound)return;v.dataset.safeBound='1';v.muted=true;v.loop=true;v.playsInline=true;v.addEventListener('play',()=>{if(activePreview&&activePreview!==v)activePreview.pause();activePreview=v});v.closest('.videoFrame')?.addEventListener('click',()=>openViewer('video',v.currentSrc||v.src,v.closest('.videoFrame')?.dataset.name||'Видео'));tryStartOnePreview(v)})}
function tryStartOnePreview(v){if(!v||document.hidden)return;document.querySelectorAll('.videoFrame video').forEach(x=>{if(x!==v)x.pause()});activePreview=v;v.muted=true;v.play().catch(()=>{})}
function pausePreviews(){document.querySelectorAll('.videoFrame video').forEach(v=>v.pause())}function resumePreview(){const v=[...document.querySelectorAll('.videoFrame video')].reverse().find(x=>x.isConnected);if(v)tryStartOnePreview(v)}
function appendPending(m,force=true){if(!currentConversation||m.conversation_id!==currentConversation.id)return;const box=document.getElementById('messages');if(!box||document.getElementById('p-'+m.client_message_id)||rendered.has(m.client_message_id))return;const stick=force||nearBottom(),r=document.createElement('div');r.id='p-'+m.client_message_id;r.className='row mine pending';const b=document.createElement('div');b.className='bubble';b.appendChild(document.createTextNode(m.body||''));const s=document.createElement('span');s.className='seq';s.innerHTML='<span class="spin"></span>';b.appendChild(s);r.appendChild(b);box.appendChild(r);if(stick)bottom()}function syncPending(){if(!currentConversation)return;const ids=new Set(q().filter(m=>m.conversation_id===currentConversation.id).map(m=>m.client_message_id));document.querySelectorAll('.pending[id^="p-"]').forEach(r=>{if(!ids.has(r.id.slice(2))&&!uploadJobs.some(j=>'p-'+j.clientId===r.id))r.remove()});q().filter(m=>m.conversation_id===currentConversation.id).forEach(m=>appendPending(m,false))}async function flush(){if(flushing||!navigator.onLine||!session)return;flushing=true;try{for(const m of [...q()]){const {data,error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error){status('Очередь остановлена · повторю позже','bad');break}dequeue(m.client_message_id);if(data&&currentConversation?.id===m.conversation_id)appendMessages([data],true)}}finally{flushing=false}}
function sendNow(){const input=document.getElementById('msg');const body=input.value.trim();if(!body||!currentConversation)return;const m={conversation_id:currentConversation.id,client_message_id:uuid(),body};input.value='';input.dispatchEvent(new Event('input'));enqueue(m);appendPending(m,true);flush()}
function ensureInputs(){if(document.getElementById('galleryInput'))return;const shell=document.querySelector('.chatShell');if(!shell)return;[['galleryInput','image/*,video/*',true,'gallery',''],['cameraInput','image/*,video/*',false,'camera','environment'],['docInput','.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.rtf,.zip,.rar,.7z',true,'document',''],['fileInput','',true,'files',''],['scanInput','image/*',false,'scan','environment'],['contactInput','.vcf,text/vcard,text/x-vcard',false,'contact','']].forEach(a=>{const x=document.createElement('input');x.id=a[0];x.type='file';x.hidden=true;if(a[1])x.accept=a[1];if(a[2])x.multiple=true;if(a[4])x.setAttribute('capture',a[4]);x.dataset.source=a[3];shell.appendChild(x)});['galleryInput','cameraInput','docInput','fileInput','scanInput'].forEach(i=>document.getElementById(i).onchange=e=>{addFiles(e.target.files,e.target.dataset.source);e.target.value=''});document.getElementById('contactInput').onchange=contactFile}function pick(id){document.getElementById(id)?.click()}function addFiles(files,source){for(const f of Array.from(files||[])){if(!f||!f.size)continue;if(f.size>MAX_FILE){status('Файл больше 1 ГБ не добавлен','bad');continue}const key=f.name+':'+f.size+':'+f.lastModified;if(selected.some(x=>x.key===key))continue;const kind=classify(f,source);let url='';if(kind==='image'||kind==='video'){url=URL.createObjectURL(f);selectedUrls.push(url)}selected.push({key,file:f,kind,source,url})}renderSheet()}
function clearSel(){selectedUrls.forEach(URL.revokeObjectURL);selectedUrls=[];selected=[]}function closeSheet(){document.getElementById('sheet')?.remove()}function openSheet(){if(document.getElementById('sheet')){closeSheet();return}activeTab='gallery';clearSel();const shell=document.querySelector('.chatShell');const d=document.createElement('div');d.id='sheet';d.className='sheetBackdrop';d.innerHTML=`<section class="sheet"><header class="sheetHead"><button id="sheetClose" class="iconBtn sheetClose">×</button><div id="sheetTitle" class="sheetTitle"></div><span></span></header><main id="sheetBody" class="sheetBody"></main><div id="sendDock" class="sendDock"><button id="sendFiles" class="sendBtn">Отправить</button></div><nav class="tabbar"><button class="tab active" data-tab="gallery">${icons.cam}<span>Галерея</span></button><button class="tab" data-tab="location">${icons.pin}<span>Геопозиция</span></button><button class="tab" data-tab="contact">${icons.contact}<span>Контакт</span></button><button class="tab" data-tab="docs">${icons.file}<span>Документы</span></button></nav></section>`;shell.appendChild(d);d.onclick=e=>{if(e.target===d)closeSheet()};d.querySelector('.sheet').onclick=e=>e.stopPropagation();document.getElementById('sheetClose').onclick=closeSheet;document.getElementById('sendFiles').onclick=sendFiles;d.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{activeTab=x.dataset.tab;renderSheet()});renderSheet()}
function renderSheet(){const b=document.getElementById('sheetBody'),t=document.getElementById('sheetTitle'),dock=document.getElementById('sendDock'),send=document.getElementById('sendFiles');if(!b)return;const title={gallery:'Недавние',location:'Геопозиция',contact:'Контакты',docs:'Документы'}[activeTab];t.innerHTML=`${title}<span class="sheetSub">${selected.length?'Выбрано: '+selected.length:VERSION}</span>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));dock.classList.toggle('show',selected.length>0);send.textContent=selected.length?`Отправить ${selected.length} · ${size(selected.reduce((s,x)=>s+x.file.size,0))}`:'Отправить';if(activeTab==='gallery')b.innerHTML=galleryHtml();else if(activeTab==='location')b.innerHTML=`<div class="panel"><button id="locNow" class="panelAction">${icons.pin}<span><strong>Отправить геопозицию</strong><small>Текущая точка по GPS</small></span></button></div>`;else if(activeTab==='contact')b.innerHTML=`<div class="panel"><button id="contactBtn" class="panelAction">${icons.contact}<span><strong>Выбрать контакт</strong><small>Контакт из телефона или vCard</small></span></button></div>`;else b.innerHTML=`<div class="panel"><button id="docBtn" class="panelAction">${icons.file}<span><strong>Выбрать документ</strong><small>PDF, Word, Excel, презентации, архивы</small></span></button><button id="fileBtn" class="panelAction">${icons.file}<span><strong>Выбрать из файлов</strong><small>Любой файл из приложения «Файлы»</small></span></button><button id="scanBtn" class="panelAction">${icons.scan}<span><strong>Сканировать документ</strong><small>Открыть камеру для скана</small></span></button>${fileList(x=>x.kind==='document')}</div>`;bindSheet()}function galleryHtml(){const media=selected.filter(x=>x.kind==='image'||x.kind==='video');const thumbs=media.map(x=>`<button class="tile thumb" data-rm="${esc(x.key)}">${x.kind==='video'?`<video src="${esc(x.url)}" muted playsinline preload="metadata"></video><span class="mediaType">Видео</span>`:`<img src="${esc(x.url)}" alt="">`}<span class="check">✓</span></button>`).join('');return`<div class="galleryGrid"><button id="cameraTile" class="tile cameraTile">${icons.cam}<span>Камера</span></button>${thumbs}${Array.from({length:Math.max(0,3-media.length)},()=>'<button class="tile emptyTile" data-open-gallery></button>').join('')}<button id="openGallery" class="tile galleryOpen">${icons.cam}<span>Открыть галерею</span></button></div>`}function fileList(fn){const a=selected.filter(fn);return a.length?`<div class="fileList">${a.map(x=>`<div class="fileRow"><div class="fileIcon">${icons.file}</div><div><div class="fileName">${esc(x.file.name)}</div><div class="fileMeta">${size(x.file.size)}</div></div></div>`).join('')}</div>`:''}function bindSheet(){document.getElementById('cameraTile')?.addEventListener('click',()=>pick('cameraInput'));document.getElementById('openGallery')?.addEventListener('click',()=>pick('galleryInput'));document.querySelectorAll('[data-open-gallery]').forEach(x=>x.onclick=()=>pick('galleryInput'));document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{const i=selected.findIndex(y=>y.key===x.dataset.rm);if(i>=0){const u=selected[i].url;if(u){URL.revokeObjectURL(u);selectedUrls=selectedUrls.filter(z=>z!==u)}selected.splice(i,1);renderSheet()}});document.getElementById('locNow')?.addEventListener('click',locationSend);document.getElementById('contactBtn')?.addEventListener('click',contactChoose);document.getElementById('docBtn')?.addEventListener('click',()=>pick('docInput'));document.getElementById('fileBtn')?.addEventListener('click',()=>pick('fileInput'));document.getElementById('scanBtn')?.addEventListener('click',()=>pick('scanInput'))}
function contactChoose(){if(navigator.contacts?.select){navigator.contacts.select(['name','tel','email'],{multiple:false}).then(r=>{const c=r?.[0];if(!c)return;const input=document.getElementById('msg');closeSheet();input.value=['👤 '+(c.name?.[0]||'Контакт'),c.tel?.[0]||'',c.email?.[0]||''].filter(Boolean).join('\n');sendNow()}).catch(()=>pick('contactInput'))}else pick('contactInput')}async function contactFile(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;const text=await f.text().catch(()=>'');const name=(text.match(/^FN:(.+)$/mi)?.[1]||f.name).trim(),tel=(text.match(/^TEL[^:]*:(.+)$/mi)?.[1]||'').trim(),mail=(text.match(/^EMAIL[^:]*:(.+)$/mi)?.[1]||'').trim();const input=document.getElementById('msg');closeSheet();input.value=['👤 '+name,tel,mail].filter(Boolean).join('\n');sendNow()}function locationSend(){closeSheet();if(!navigator.geolocation){status('Геолокация недоступна','bad');return}status('Определяю геопозицию…');navigator.geolocation.getCurrentPosition(p=>{const input=document.getElementById('msg');input.value=`📍 Геопозиция\nhttps://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;sendNow()},e=>status(e.message||'Не удалось получить геопозицию','bad'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function sendFiles(){if(!selected.length||!currentConversation)return;const jobs=selected.map(x=>makeJob(x));uploadJobs.push(...jobs);closeSheet();clearSel();for(const j of jobs)appendUpload(j,true);processUploads()}function makeJob(x){const cid=uuid();const prev=(x.kind==='image'||x.kind==='video')?URL.createObjectURL(x.file):'';return{clientId:cid,conversationId:currentConversation.id,file:x.file,kind:x.kind,name:x.file.name||'Файл',mime:x.file.type||'application/octet-stream',size:x.file.size,path:`${currentConversation.id}/${session.user.id}/${cid}/${safeName(x.file.name,x.file.type)}`,preview:prev,status:'queued',uploaded:false,error:''}}
function pendingHtml(j){if(j.kind==='document')return`<div class="docCard"><div class="docIcon">${icons.file}</div><div><div class="docTitle">${esc(j.name)}</div><div class="docMeta">${size(j.size)} · ${j.status==='error'?'ошибка':'загрузка'}</div></div></div>${j.status==='error'?`<div class="mediaErr">${esc(j.error)}<br><button class="retry" data-retry="${j.clientId}">Повторить</button></div>`:''}`;return`<div class="pendingPreview">${j.kind==='video'?`<video src="${esc(j.preview)}" muted playsinline preload="metadata"></video>`:`<img src="${esc(j.preview)}" alt="">`}<div class="pendingOverlay">${j.status==='error'?'':'<span class="spin"></span>'}<span>${j.status==='error'?'Не удалось отправить':'Загрузка…'}</span>${j.status==='error'?`<button class="retry" data-retry="${j.clientId}">Повторить</button>`:''}</div></div>`}function appendUpload(j,force){const box=document.getElementById('messages');if(!box||document.getElementById('p-'+j.clientId))return;const r=document.createElement('div');r.id='p-'+j.clientId;r.className='row mine pending mediaRow';const b=document.createElement('div');b.className='bubble mediaBubble';b.innerHTML=pendingHtml(j);r.appendChild(b);box.appendChild(r);bindRetry(r);if(force)bottom()}function repaintUpload(j){const r=document.getElementById('p-'+j.clientId);if(!r)return;r.querySelector('.bubble').innerHTML=pendingHtml(j);bindRetry(r)}function bindRetry(scope){scope.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const j=uploadJobs.find(x=>x.clientId===b.dataset.retry);if(j){j.status='queued';j.error='';repaintUpload(j);processUploads()}})}async function processUploads(){if(processing||!navigator.onLine||!session)return;processing=true;try{for(const j of uploadJobs){if(j.status==='done'||j.status==='error')continue;try{j.status='uploading';repaintUpload(j);if(!j.uploaded){const {error}=await sb.storage.from(BUCKET).upload(j.path,j.file,{cacheControl:'3600',contentType:j.mime,upsert:false});if(error&&!/exists|duplicate/i.test(error.message||''))throw error;j.uploaded=true}j.status='sending';repaintUpload(j);const {data,error}=await sb.rpc('send_attachment_message',{p_conversation_id:j.conversationId,p_client_message_id:j.clientId,p_type:j.kind,p_attachment_path:j.path,p_attachment_name:j.name,p_mime_type:j.mime,p_size_bytes:j.size,p_caption:null});if(error)throw error;j.status='done';if(data&&currentConversation?.id===j.conversationId)appendMessages([data],true)}catch(e){j.error=e.message||String(e);j.status=(!navigator.onLine||/network|fetch|load failed/i.test(j.error))?'queued':'error';repaintUpload(j);status(j.status==='queued'?'Сеть потеряна · повторю позже':j.error,'bad');if(j.status==='queued')break}}}finally{processing=false}}
function openViewer(type,url,name){closeSheet();pausePreviews();const viewer=document.createElement('div');viewer.className='viewer';viewer.innerHTML=`<div class="viewerTop"><button class="iconBtn" id="viewerBack">${icons.back}</button><div class="viewerTitle">${esc(name||'Медиа')}</div>${type==='document'?`<a class="downloadBtn" href="${esc(url)}" download>Скачать</a>`:''}</div><div class="viewerBody" id="viewerBody">${type==='image'?`<img src="${esc(url)}" alt="">`:type==='video'?`<video src="${esc(url)}" autoplay playsinline loop preload="auto"></video>`:name.toLowerCase().endsWith('.pdf')?`<iframe src="${esc(url)}"></iframe>`:`<div class="card" style="margin:0"><div class="brand">VISION TALK</div><div class="title" style="font-size:30px">Документ</div><div class="muted">${esc(name)}</div><a class="btn full" href="${esc(url)}" download style="display:block;text-align:center;text-decoration:none">Скачать</a></div>`}</div>`;document.body.appendChild(viewer);document.getElementById('viewerBack').onclick=()=>{viewer.remove();resumePreview()};const vid=viewer.querySelector('video');if(vid){vid.muted=false;vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{})});vid.onclick=e=>{e.stopPropagation();vid.paused?vid.play().catch(()=>{}):vid.pause()}}let startY=0,drag=0;viewer.addEventListener('pointerdown',e=>{startY=e.clientY;drag=0;try{viewer.setPointerCapture(e.pointerId)}catch{}});viewer.addEventListener('pointermove',e=>{drag=Math.max(0,e.clientY-startY);document.getElementById('viewerBody')?.style.setProperty('--drag',drag+'px')});viewer.addEventListener('pointerup',()=>{if(drag>95){viewer.remove();resumePreview()}else document.getElementById('viewerBody')?.style.setProperty('--drag','0px')})}
window.addEventListener('online',()=>{status('Сеть восстановлена','good');flush();processUploads();currentConversation?newMessages():loadDialogs()});window.addEventListener('offline',()=>status('Нет сети · очередь сохранится','bad'));document.addEventListener('visibilitychange',()=>{if(document.hidden)pausePreviews();else{resumePreview();if(currentConversation)newMessages();processUploads()}});boot();
