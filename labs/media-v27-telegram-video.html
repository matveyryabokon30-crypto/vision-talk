<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vision Talk — media v27 lab</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#070707;color:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070707;color:#fff;overflow:hidden}button,input{font:inherit}.app{height:100dvh;max-width:760px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#070707}.top{height:78px;display:grid;grid-template-columns:42px 42px minmax(0,1fr);align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #252525}.icon{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}.avatar{width:42px;height:42px;border-radius:50%;background:#1d1d1d;border:1px solid #303030;color:#a8ffbd;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}.name{font-size:22px;font-weight:900}.sub{font-size:13px;color:#777;margin-top:2px}.msgs{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px}.row{display:flex}.row.mine{justify-content:flex-end}.bubble{max-width:78%;border-radius:22px;background:#242424;color:#fff;padding:12px 14px;font-size:19px}.mine .bubble{background:#f2f2f2;color:#111}.seq{font-size:12px;color:#888;margin-top:5px;display:block}.media{padding:0!important;overflow:hidden;background:#111!important;color:#fff!important;position:relative;max-width:min(82vw,350px);min-width:190px}.photo,.videoCard{position:relative;display:block;width:100%;border:0;background:#0a0a0a;color:inherit;padding:0;margin:0;overflow:hidden;border-radius:22px}.photo img{display:block;width:100%;max-height:390px;object-fit:contain}.videoCard video{display:block;width:100%;height:auto;max-height:430px;object-fit:cover;background:#050505;pointer-events:none}.videoCard.portrait video{aspect-ratio:9/16}.videoCard.landscape video{aspect-ratio:16/9}.stamp{position:absolute;right:8px;bottom:7px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:11px}.tag{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.45);font-size:11px;font-weight:800}.doc{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;min-width:245px;padding:12px;text-decoration:none;color:inherit;background:#242424;border:0;border-radius:22px;text-align:left}.docIcon{width:48px;height:48px;border-radius:14px;background:#303030;color:#a8ffbd;display:flex;align-items:center;justify-content:center}.docTitle{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.docMeta{font-size:12px;color:#888;margin-top:4px}.composer{display:grid;grid-template-columns:42px minmax(0,1fr)42px;align-items:center;gap:8px;padding:7px 9px max(7px,env(safe-area-inset-bottom));border-top:1px solid #242424;background:#090909}.pill{height:42px;border:1px solid #333;border-radius:22px;background:#111;display:grid;grid-template-columns:minmax(0,1fr)36px;align-items:center;padding-left:15px}.msg{height:40px;background:transparent;color:#fff;border:0;outline:0;font-size:18px}.sheetBg{position:absolute;inset:0;background:rgba(0,0,0,.58);z-index:30;display:flex;align-items:flex-end}.sheet{width:100%;height:min(78%,680px);min-height:430px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:#171717;border-radius:24px 24px 0 0;overflow:hidden}.sheetHead{height:58px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;background:#1b1b1b;border-bottom:1px solid #2a2a2a;padding:6px 9px}.sheetTitle{text-align:center;font-size:20px;font-weight:900}.sheetSub{display:block;color:#8d8d8d;font-size:12px;font-weight:600;margin-top:2px}.sheetBody{min-height:0;overflow:auto;background:#e8e8e8}.grid{--cell:min(calc(33.333vw - .67px),252px);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:var(--cell);gap:1px;background:#f3f3f3}.tile{position:relative;border:0;border-radius:0;margin:0;padding:0;overflow:hidden;background:#191919;color:#fff}.camera{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(145deg,#303030,#171717);font-weight:800}.openGal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#213023;color:#a8ffbd;font-weight:900;font-size:12px}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}.check{position:absolute;right:6px;top:6px;width:25px;height:25px;border-radius:50%;background:#a8ffbd;color:#111;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-weight:900}.empty:after{content:'+';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555;font-size:28px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:7px 4px max(7px,env(safe-area-inset-bottom));background:#1b1b1b;border-top:1px solid #2a2a2a}.tab{height:66px;border:0;border-radius:15px;background:transparent;color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.tab.active{background:#303030;color:#a8ffbd}.dock{display:none;padding:7px 9px;background:#171717;border-top:1px solid #2a2a2a}.dock.show{display:block}.send{width:100%;height:44px;border:0;border-radius:13px;background:#a8ffbd;color:#111;font-size:15px;font-weight:900}.panel{padding:10px;background:#111;min-height:100%;display:flex;flex-direction:column;gap:9px}.panel button{min-height:64px;border:0;border-radius:16px;background:#242424;color:#fff;text-align:left;padding:12px 14px}.viewer{position:fixed;inset:0;z-index:200;background:#000;display:block;touch-action:none;overflow:hidden}.viewerClose{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top));z-index:3;width:46px;height:46px;border:0;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}.viewerMedia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;transform:translateY(var(--drag,0px));transition:transform .16s ease}.viewerMedia img,.viewerMedia video{max-width:100%;max-height:100%;object-fit:contain;background:#000}.viewerMedia video{width:100%;height:100%;object-fit:contain}.viewerHint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.55);padding:5px 9px;background:rgba(0,0,0,.32);border-radius:999px}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;max-width:calc(100vw - 24px);padding:9px 14px;border-radius:14px;background:#303030;color:#fff;text-align:center;font-size:14px}.bad{background:#8b5a00}.good{background:#174d29}@media(max-width:380px){.bubble{max-width:84%}.media{max-width:86vw}.tab{font-size:9px}}
</style></head><body>
<div class="app" id="app"><div class="top"><button class="icon" id="back">‹</button><div class="avatar">V</div><div><div class="name">@media_lab</div><div class="sub">Vision Talk · isolated media-v27</div></div></div><main class="msgs" id="msgs"></main><div class="composer"><button class="icon" id="attach">+</button><div class="pill"><input class="msg" placeholder="Сообщение" readonly><button class="icon" id="cam">▣</button></div><button class="icon">🎙</button></div></div>
<input id="gallery" type="file" accept="image/*,video/*" multiple hidden><input id="doc" type="file" multiple hidden><input id="camera" type="file" accept="image/*,video/*" capture="environment" hidden>
<script>
const msgs=document.getElementById('msgs');let seq=80,selected=[],tab='gallery';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function size(n){if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(n<10240?1:0)+' КБ';return(n/1048576).toFixed(n<10485760?1:0)+' МБ'}function bottom(){requestAnimationFrame(()=>msgs.scrollTop=msgs.scrollHeight)}function status(t,k=''){let e=document.getElementById('st');if(!e){e=document.createElement('div');e.id='st';document.body.appendChild(e)}e.className='status '+k;e.textContent=t;clearTimeout(status.t);if(k==='good')status.t=setTimeout(()=>e.remove(),1600)}function kind(f){if(f.type.startsWith('image/'))return'image';if(f.type.startsWith('video/'))return'video';return'doc'}
function addText(t){const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="bubble">${esc(t)}<span class="seq">#${seq++}</span></div>`;msgs.appendChild(r);bottom()}
function addFile(file){const k=kind(file),url=URL.createObjectURL(file),r=document.createElement('div');r.className='row mine';if(k==='image')r.innerHTML=`<div class="bubble media"><button class="photo" data-type="image" data-url="${esc(url)}"><img src="${esc(url)}"><span class="stamp">#${seq++} · ✓✓</span></button></div>`;else if(k==='video')r.innerHTML=`<div class="bubble media"><button class="videoCard portrait" data-type="video" data-url="${esc(url)}"><video src="${esc(url)}" muted autoplay loop playsinline preload="auto"></video><span class="tag">Видео</span><span class="stamp">#${seq++} · ✓✓</span></button></div>`;else r.innerHTML=`<div class="bubble media"><button class="doc" data-type="doc" data-url="${esc(url)}"><div class="docIcon">📄</div><div><div class="docTitle">${esc(file.name)}</div><div class="docMeta">${size(file.size)}</div></div></button></div>`;msgs.appendChild(r);bindOpen(r);bottom();const v=r.querySelector('video');if(v){const play=()=>v.play().catch(()=>status('iPhone не дал autoplay до первого тапа','bad'));v.addEventListener('loadedmetadata',()=>{if(v.videoWidth>v.videoHeight)r.querySelector('.videoCard').classList.replace('portrait','landscape');play()},{once:true});v.addEventListener('canplay',play,{once:true});setTimeout(play,250)}}
function bindOpen(scope=document){scope.querySelectorAll('[data-url]').forEach(el=>{if(el.dataset.bound)return;el.dataset.bound='1';el.onclick=()=>openViewer(el.dataset.type,el.dataset.url)})}
function openViewer(type,url){closeSheet();const v=document.createElement('div');v.className='viewer';v.innerHTML=`<button class="viewerClose">‹</button><div class="viewerMedia" id="viewerMedia">${type==='image'?`<img src="${esc(url)}">`:type==='video'?`<video src="${esc(url)}" autoplay playsinline loop preload="auto"></video>`:`<iframe src="${esc(url)}" style="width:100%;height:100%;border:0;background:white"></iframe>`}</div><div class="viewerHint">свайп вниз — закрыть</div>`;document.body.appendChild(v);v.querySelector('.viewerClose').onclick=()=>v.remove();const vid=v.querySelector('video');if(vid){vid.controls=false;vid.muted=false;vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{})});vid.onclick=e=>{e.stopPropagation();if(vid.paused)vid.play();else vid.pause()}}let sy=0,d=0;v.addEventListener('pointerdown',e=>{sy=e.clientY;d=0;v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{d=Math.max(0,e.clientY-sy);document.getElementById('viewerMedia')?.style.setProperty('--drag',d+'px')});v.addEventListener('pointerup',()=>{if(d>95)v.remove();else document.getElementById('viewerMedia')?.style.setProperty('--drag','0px')})}
function openSheet(){if(document.getElementById('sheet'))return closeSheet();selected=[];tab='gallery';const s=document.createElement('div');s.id='sheet';s.className='sheetBg';s.innerHTML=`<section class="sheet"><header class="sheetHead"><button id="x" class="icon">×</button><div id="ttl" class="sheetTitle"></div><span></span></header><main id="body" class="sheetBody"></main><div id="dock" class="dock"><button id="send" class="send">Отправить</button></div><nav class="tabs"><button class="tab active" data-tab="gallery">▣<span>Галерея</span></button><button class="tab" data-tab="geo">⌖<span>Гео</span></button><button class="tab" data-tab="contact">♙<span>Контакт</span></button><button class="tab" data-tab="docs">▤<span>Документы</span></button></nav></section>`;document.getElementById('app').appendChild(s);s.onclick=e=>{if(e.target===s)closeSheet()};s.querySelector('.sheet').onclick=e=>e.stopPropagation();document.getElementById('x').onclick=closeSheet;document.getElementById('send').onclick=sendSelected;s.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderSheet()});renderSheet()}
function closeSheet(){document.getElementById('sheet')?.remove()}function renderSheet(){const b=document.getElementById('body'),t=document.getElementById('ttl'),dock=document.getElementById('dock');if(!b)return;t.innerHTML=`${tab==='gallery'?'Недавние':tab==='docs'?'Документы':tab==='geo'?'Геопозиция':'Контакты'}<span class="sheetSub">${selected.length?'Выбрано: '+selected.length:'isolated media-v27'}</span>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));dock.classList.toggle('show',selected.length>0);if(tab==='gallery')b.innerHTML=galleryHtml();else if(tab==='docs')b.innerHTML=`<div class="panel"><button id="docBtn"><b>Выбрать документ</b><br><small>PDF, Word, архивы</small></button><button id="fileBtn"><b>Выбрать из файлов</b><br><small>Любой файл</small></button><button id="scanBtn"><b>Сканировать документ</b><br><small>Камера для скана</small></button></div>`;else b.innerHTML='<div class="panel"><button><b>Заглушка лаборатории</b><br><small>Здесь проверяем видео UX.</small></button></div>';bindSheet()}
function galleryHtml(){const m=selected.filter(x=>x.k!=='doc');return`<div class="grid"><button id="camTile" class="tile camera">▣<span>Камера</span></button>${m.map(x=>`<button class="tile thumb" data-rm="${esc(x.key)}">${x.k==='video'?`<video src="${esc(x.url)}" muted autoplay loop playsinline></video><span class="tag">Видео</span>`:`<img src="${esc(x.url)}">`}<span class="check">✓</span></button>`).join('')}${Array.from({length:Math.max(0,3-m.length)},()=>'<button class="tile empty" data-gal></button>').join('')}<button id="openGal" class="tile openGal">▣<span>Открыть галерею</span></button></div>`}
function bindSheet(){document.getElementById('camTile')?.addEventListener('click',()=>document.getElementById('camera').click());document.getElementById('openGal')?.addEventListener('click',()=>document.getElementById('gallery').click());document.querySelectorAll('[data-gal]').forEach(x=>x.onclick=()=>document.getElementById('gallery').click());document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{selected=selected.filter(y=>y.key!==x.dataset.rm);renderSheet()});document.getElementById('docBtn')?.addEventListener('click',()=>document.getElementById('doc').click());document.getElementById('fileBtn')?.addEventListener('click',()=>document.getElementById('doc').click());document.getElementById('scanBtn')?.addEventListener('click',()=>document.getElementById('camera').click())}
function choose(files){for(const f of Array.from(files||[])){const key=f.name+':'+f.size+':'+f.lastModified;if(selected.some(x=>x.key===key))continue;const k=kind(f),url=k==='doc'?'':URL.createObjectURL(f);selected.push({key,file:f,k,url})}renderSheet()}function sendSelected(){const a=selected.slice();selected=[];closeSheet();a.forEach(x=>addFile(x.file))}
document.getElementById('attach').onclick=openSheet;document.getElementById('cam').onclick=()=>document.getElementById('camera').click();document.getElementById('gallery').onchange=e=>{choose(e.target.files);e.target.value=''};document.getElementById('camera').onchange=e=>{Array.from(e.target.files||[]).forEach(addFile);e.target.value=''};document.getElementById('doc').onchange=e=>{Array.from(e.target.files||[]).forEach(addFile);e.target.value=''};addText('Видео теперь должно быть живым прямо в пузыре: без Play-кнопки и без нативного плеера.');
</script></body></html>
