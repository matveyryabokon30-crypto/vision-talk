<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vision Talk media v28</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#070707;color:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070707;color:#fff}button,input{font:inherit}.app{height:100dvh;max-width:760px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#070707}.top{height:76px;display:grid;grid-template-columns:42px 42px 1fr;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #252525}.back,.round{width:42px;height:42px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:30px}.avatar{width:42px;height:42px;border-radius:50%;background:#1d1d1d;border:1px solid #333;color:#a8ffbd;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}.name{font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:#777;margin-top:2px}.messages{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px}.row{display:flex}.mine{justify-content:flex-end}.bubble{max-width:82%;border-radius:22px;background:#242424;color:#fff;padding:12px 14px;font-size:19px;line-height:1.25}.mine .bubble{background:#f2f2f2;color:#111}.mediaBubble{padding:0!important;overflow:hidden;background:#111!important;color:#fff!important;min-width:190px;max-width:min(82vw,350px)}.mediaBtn{position:relative;display:block;border:0;padding:0;margin:0;width:100%;background:#050505;color:#fff;text-align:left;overflow:hidden}.mediaBtn img{display:block;width:100%;max-height:410px;object-fit:contain}.videoBtn{border-radius:22px;background:#090909}.videoBtn video{display:block;width:100%;height:auto;max-height:430px;object-fit:cover;background:#101010;pointer-events:none}.videoBtn.portrait video{aspect-ratio:9/16}.videoBtn.landscape video{aspect-ratio:16/9}.seq{position:absolute;right:8px;bottom:7px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-size:11px}.tag{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.42);color:#fff;font-size:11px;font-weight:800}.doc{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;min-width:245px;padding:12px;border:0;background:#242424;color:#fff;border-radius:22px;text-align:left}.docIcon{width:48px;height:48px;border-radius:14px;background:#303030;color:#a8ffbd;display:flex;align-items:center;justify-content:center;font-size:26px}.docTitle{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.docMeta{font-size:12px;color:#888;margin-top:4px}.composer{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;padding:7px 9px max(7px,env(safe-area-inset-bottom));border-top:1px solid #242424;background:#090909}.pill{height:42px;border:1px solid #333;border-radius:22px;background:#111;display:flex;align-items:center;padding:0 14px;color:#777;font-size:18px}.sheet{position:absolute;inset:auto 0 0;z-index:30;background:#171717;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -16px 45px rgba(0,0,0,.5)}.sheetHead{height:58px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid #2a2a2a;padding:6px 9px}.sheetTitle{text-align:center;font-size:20px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.tool{height:92px;border:0;border-radius:18px;background:#242424;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:800}.viewer{position:fixed;inset:0;z-index:200;background:#000;display:grid;grid-template-rows:54px 1fr;touch-action:none}.viewerTop{display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(0,0,0,.82)}.viewerTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.viewerBody{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;transform:translateY(var(--dy,0px));transition:transform .14s}.viewerBody img,.viewerBody video{max-width:100%;max-height:100%;object-fit:contain;background:#000}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;max-width:calc(100vw - 24px);background:#8b5a00;color:#fff;padding:9px 14px;border-radius:14px;font-size:14px;text-align:center}@media(max-width:380px){.mediaBubble{max-width:86vw}.bubble{max-width:86%}}
</style></head><body><div class="app" id="app"><div class="top"><button class="back">‹</button><div class="avatar">V</div><div><div class="name">@media_lab</div><div class="sub">Vision Talk · isolated media-v28</div></div></div><main id="messages" class="messages"></main><div class="composer"><button id="plus" class="round">+</button><div class="pill">Сообщение</div><button id="camera" class="round">▣</button></div></div>
<input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden><input id="docInput" type="file" multiple hidden><input id="camInput" type="file" accept="image/*,video/*" capture="environment" hidden>
<script>
const msg=document.getElementById('messages');let seq=80,activePreview=null,sheet=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function size(n){return n<1048576?(n/1024).toFixed(0)+' КБ':(n/1048576).toFixed(1)+' МБ'}function bottom(){requestAnimationFrame(()=>msg.scrollTop=msg.scrollHeight)}function toast(t){let e=document.getElementById('st');if(!e){e=document.createElement('div');e.id='st';e.className='status';document.body.appendChild(e)}e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.remove(),2200)}function kind(f){if(f.type.startsWith('image/'))return'image';if(f.type.startsWith('video/'))return'video';return'doc'}function pausePreviews(except=null){document.querySelectorAll('.videoBtn video').forEach(v=>{if(v!==except)v.pause()});if(except)activePreview=except}function activateVideo(v){pausePreviews(v);v.muted=true;v.loop=true;v.playsInline=true;v.play().catch(()=>toast('iOS разрешит движение после первого тапа по видео'))}
function addFile(f){const t=kind(f),url=URL.createObjectURL(f),row=document.createElement('div');row.className='row mine';if(t==='image'){row.innerHTML=`<div class="bubble mediaBubble"><button class="mediaBtn" data-type="image" data-url="${esc(url)}" data-name="${esc(f.name)}"><img src="${esc(url)}"><span class="seq">#${seq++} · ✓✓</span></button></div>`}else if(t==='video'){row.innerHTML=`<div class="bubble mediaBubble"><button class="mediaBtn videoBtn portrait" data-type="video" data-url="${esc(url)}" data-name="${esc(f.name)}"><video src="${esc(url)}" muted autoplay loop playsinline preload="auto"></video><span class="tag">Видео</span><span class="seq">#${seq++} · ✓✓</span></button></div>`}else{row.innerHTML=`<div class="bubble mediaBubble"><button class="doc" data-type="doc" data-url="${esc(url)}" data-name="${esc(f.name)}"><div class="docIcon">▤</div><div><div class="docTitle">${esc(f.name)}</div><div class="docMeta">${size(f.size)}</div></div></button></div>`}msg.appendChild(row);bind(row);bottom();if(t==='video'){const v=row.querySelector('video'),btn=row.querySelector('.videoBtn');v.addEventListener('loadedmetadata',()=>{if(v.videoWidth>v.videoHeight)btn.classList.replace('portrait','landscape');activateVideo(v)},{once:true});btn.addEventListener('pointerenter',()=>activateVideo(v));setTimeout(()=>activateVideo(v),220)}}
function bind(scope=document){scope.querySelectorAll('[data-type]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=()=>openViewer(b.dataset.type,b.dataset.url,b.dataset.name,b.querySelector('video'))})}
function openViewer(type,url,name,sourceVideo){closeSheet();pausePreviews();const v=document.createElement('div');v.className='viewer';v.innerHTML=`<div class="viewerTop"><button id="closeV" class="round">‹</button><div class="viewerTitle">${esc(name||'Медиа')}</div></div><div id="viewerBody" class="viewerBody">${type==='image'?`<img src="${esc(url)}">`:type==='video'?`<video id="fullVideo" src="${esc(url)}" autoplay playsinline loop></video>`:`<iframe src="${esc(url)}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`}</div>`;document.body.appendChild(v);const close=()=>{v.remove();if(sourceVideo)activateVideo(sourceVideo)};document.getElementById('closeV').onclick=close;const full=document.getElementById('fullVideo');if(full){full.muted=false;full.controls=false;full.play().catch(()=>{full.muted=true;full.play().catch(()=>{})});full.onclick=e=>{e.stopPropagation();full.paused?full.play():full.pause()}}let y=0,dy=0;v.addEventListener('pointerdown',e=>{y=e.clientY;dy=0;v.setPointerCapture(e.pointerId)});v.addEventListener('pointermove',e=>{dy=Math.max(0,e.clientY-y);document.getElementById('viewerBody').style.setProperty('--dy',dy+'px')});v.addEventListener('pointerup',()=>{dy>95?close():document.getElementById('viewerBody')?.style.setProperty('--dy','0px')})}
function openSheet(){if(sheet){closeSheet();return}sheet=document.createElement('div');sheet.className='sheet';sheet.id='sheet';sheet.innerHTML=`<div class="sheetHead"><button id="x" class="round">×</button><div class="sheetTitle">Вложения</div><span></span></div><div class="grid"><button id="gal" class="tool">▣<span>Галерея</span></button><button id="cam" class="tool">▣<span>Камера</span></button><button id="doc" class="tool">▤<span>Документы</span></button></div>`;document.getElementById('app').appendChild(sheet);document.getElementById('x').onclick=closeSheet;document.getElementById('gal').onclick=()=>document.getElementById('mediaInput').click();document.getElementById('cam').onclick=()=>document.getElementById('camInput').click();document.getElementById('doc').onclick=()=>document.getElementById('docInput').click()}function closeSheet(){document.getElementById('sheet')?.remove();sheet=null}
document.getElementById('plus').onclick=openSheet;document.getElementById('camera').onclick=()=>document.getElementById('camInput').click();document.getElementById('mediaInput').onchange=e=>{closeSheet();Array.from(e.target.files||[]).forEach(addFile);e.target.value=''};document.getElementById('camInput').onchange=e=>{closeSheet();Array.from(e.target.files||[]).forEach(addFile);e.target.value=''};document.getElementById('docInput').onchange=e=>{closeSheet();Array.from(e.target.files||[]).forEach(addFile);e.target.value=''};addFile(new File(['demo'],'readme.txt',{type:'text/plain'}));msg.lastChild.querySelector('.docTitle').textContent='v28: один активный video-preview, viewer без нативных controls';
</script></body></html>
