<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vision Talk — live video lab v26</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#070707;color:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070707;color:#fff;overflow:hidden}button,input{font:inherit}.app{height:100dvh;max-width:760px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#070707}.top{height:78px;display:grid;grid-template-columns:42px 42px minmax(0,1fr);align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #252525;background:#070707}.iconBtn{width:42px;height:42px;min-width:42px;border:0;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}.iconBtn:active{background:#1b1b1b}.avatar{width:42px;height:42px;border-radius:50%;background:#1d1d1d;border:1px solid #303030;color:#a8ffbd;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}.name{font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:#777;margin-top:2px}.messages{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px}.row{display:flex}.row.mine{justify-content:flex-end}.bubble{max-width:78%;border-radius:22px;background:#242424;color:#fff;padding:12px 14px;font-size:19px;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#f2f2f2;color:#111}.seq{display:block;font-size:12px;color:#888;margin-top:5px}.mediaBubble{padding:0!important;overflow:hidden;min-width:190px;max-width:min(82vw,350px);background:#111!important;color:#fff!important;position:relative}.photoFrame,.videoFrame{position:relative;display:block;width:100%;border:0;padding:0;margin:0;background:#0a0a0a;color:inherit;overflow:hidden;text-align:left}.photoFrame img{display:block;width:100%;max-height:390px;object-fit:contain;background:#050505}.videoFrame{border-radius:22px}.videoFrame video{display:block;width:100%;height:auto;max-height:430px;object-fit:cover;background:#050505;pointer-events:none}.videoFrame.portrait video{aspect-ratio:9/16}.videoFrame.landscape video{aspect-ratio:16/9}.videoSeq,.photoSeq{position:absolute;right:8px;bottom:7px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:11px}.videoLabel{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:800}.docCard{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;min-width:245px;padding:12px;text-decoration:none;color:inherit;background:#242424;border:0;text-align:left;width:100%;border-radius:22px}.docIcon{width:48px;height:48px;border-radius:14px;background:#303030;color:#a8ffbd;display:flex;align-items:center;justify-content:center}.docTitle{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.docMeta{font-size:12px;color:#888;margin-top:4px}.composer{display:grid;grid-template-columns:42px minmax(0,1fr)42px;align-items:center;gap:8px;padding:7px 9px max(7px,env(safe-area-inset-bottom));border-top:1px solid #242424;background:#090909}.pill{height:42px;border:1px solid #333;border-radius:22px;background:#111;display:grid;grid-template-columns:minmax(0,1fr)36px;align-items:center;padding-left:15px}.msg{width:100%;height:40px;background:transparent;color:#fff;border:0;outline:0;font-size:18px}.msg::placeholder{color:#777}.sheetBackdrop{position:absolute;inset:0;background:rgba(0,0,0,.58);z-index:30;display:flex;align-items:flex-end}.sheet{width:100%;height:min(78%,680px);min-height:430px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:#171717;border-radius:24px 24px 0 0;overflow:hidden}.sheetHead{height:58px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;background:#1b1b1b;border-bottom:1px solid #2a2a2a;padding:6px 9px}.sheetClose{background:#2d2d2d}.sheetTitle{text-align:center;font-size:20px;font-weight:900;line-height:1}.sheetSub{display:block;color:#8d8d8d;font-size:12px;font-weight:600;margin-top:2px}.sheetBody{min-height:0;overflow:auto;background:#e8e8e8}.galleryGrid{--cell:min(calc(33.333vw - .67px),252px);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:var(--cell);gap:1px;background:#f3f3f3}.tile{position:relative;border:0;border-radius:0;margin:0;padding:0;overflow:hidden;background:#191919;color:#fff;min-width:0}.cameraTile{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(145deg,#303030,#171717);font-weight:800}.galleryOpen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#213023;color:#a8ffbd;font-weight:900;font-size:12px}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}.check{position:absolute;right:6px;top:6px;width:25px;height:25px;border-radius:50%;background:#a8ffbd;color:#111;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-weight:900}.mediaType{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.72);padding:3px 5px;font-size:10px;font-weight:800}.emptyTile:after{content:'+';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555;font-size:28px}.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:7px 4px max(7px,env(safe-area-inset-bottom));background:#1b1b1b;border-top:1px solid #2a2a2a}.tab{height:66px;border:0;border-radius:15px;background:transparent;color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px}.tab.active{background:#303030;color:#a8ffbd}.sendDock{display:none;padding:7px 9px;background:#171717;border-top:1px solid #2a2a2a}.sendDock.show{display:block}.sendBtn{width:100%;height:44px;border:0;border-radius:13px;background:#a8ffbd;color:#111;font-size:15px;font-weight:900}.panel{padding:10px;background:#111;min-height:100%;display:flex;flex-direction:column;gap:9px}.panelAction{width:100%;min-height:64px;border:0;border-radius:16px;background:#242424;color:#fff;padding:12px 14px;display:grid;grid-template-columns:42px 1fr;align-items:center;gap:10px;text-align:left}.viewer{position:fixed;inset:0;z-index:200;background:#000;display:grid;grid-template-rows:auto minmax(0,1fr);touch-action:none}.viewerTop{height:54px;display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(0,0,0,.78);position:relative;z-index:2}.viewerTitle{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-size:15px}.viewerBody{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;transform:translateY(var(--drag,0px));transition:transform .16s ease}.viewerBody img,.viewerBody video{max-width:100%;max-height:100%;object-fit:contain;background:#000}.viewerBody video{width:100%;height:100%;object-fit:contain}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;max-width:calc(100vw - 24px);padding:9px 14px;border-radius:14px;background:#303030;color:#fff;text-align:center;font-size:14px}.status.bad{background:#8b5a00}.status.good{background:#174d29}@media(max-width:380px){.bubble{max-width:84%}.mediaBubble{max-width:86vw}.tab{font-size:9px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><button class="iconBtn" id="back">‹</button><div class="avatar">V</div><div><div class="name">@media_lab</div><div class="sub">Vision Talk · isolated media-v26</div></div></div>
  <main class="messages" id="messages"></main>
  <div class="composer"><button class="iconBtn" id="attach">+</button><div class="pill"><input class="msg" placeholder="Сообщение" readonly><button class="iconBtn" id="cam">▣</button></div><button class="iconBtn">🎙</button></div>
</div>
<input id="galleryInput" type="file" accept="image/*,video/*" multiple hidden>
<input id="docInput" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.rtf,.zip,.rar,.7z" multiple hidden>
<input id="fileInput" type="file" multiple hidden>
<input id="cameraInput" type="file" accept="image/*,video/*" capture="environment" hidden>
<script>
const messages=document.getElementById('messages');
let seq=72,activeTab='gallery',selected=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function size(n){if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(n<10240?1:0)+' КБ';return(n/1048576).toFixed(n<10485760?1:0)+' МБ'}
function status(t,k=''){let e=document.getElementById('st');if(!e){e=document.createElement('div');e.id='st';document.body.appendChild(e)}e.className='status '+k;e.textContent=t;clearTimeout(status.t);if(k==='good')status.t=setTimeout(()=>e.remove(),1600)}
function bottom(){requestAnimationFrame(()=>messages.scrollTop=messages.scrollHeight)}
function classify(file){if(file.type.startsWith('image/'))return'image';if(file.type.startsWith('video/'))return'video';return'document'}
function addDemo(){addText('Фото теперь чистое, видео — живое превью без кнопки Play.',false)}
function addText(text,mine=false){const r=document.createElement('div');r.className='row '+(mine?'mine':'');r.innerHTML=`<div class="bubble">${esc(text)}<span class="seq">#${seq++}${mine?' · ✓✓':''}</span></div>`;messages.appendChild(r);bottom()}
function addLocalFile(file){const type=classify(file),url=URL.createObjectURL(file);const r=document.createElement('div');r.className='row mine';let html='';if(type==='image'){html=`<div class="bubble mediaBubble"><button class="photoFrame" data-view="image" data-url="${esc(url)}" data-name="${esc(file.name)}"><img src="${esc(url)}" alt=""><span class="photoSeq">#${seq++} · ✓✓</span></button></div>`}else if(type==='video'){html=`<div class="bubble mediaBubble"><button class="videoFrame portrait" data-view="video" data-url="${esc(url)}" data-name="${esc(file.name)}"><video src="${esc(url)}" muted autoplay loop playsinline preload="auto"></video><span class="videoLabel">Видео</span><span class="videoSeq">#${seq++} · ✓✓</span></button></div>`}else{html=`<div class="bubble mediaBubble"><button class="docCard" data-view="doc" data-url="${esc(url)}" data-name="${esc(file.name)}"><div class="docIcon">📄</div><div><div class="docTitle">${esc(file.name)}</div><div class="docMeta">${size(file.size)}</div></div></button><span class="seq">#${seq++} · ✓✓</span></div>`}r.innerHTML=html;messages.appendChild(r);bindOpen(r);bottom();if(type==='video'){const v=r.querySelector('video');v.addEventListener('loadedmetadata',()=>{if(v.videoWidth>v.videoHeight)r.querySelector('.videoFrame')?.classList.replace('portrait','landscape');v.play().catch(()=>{})},{once:true});setTimeout(()=>v.play().catch(()=>status('iPhone заблокировал autoplay до тапа, но чёрной карточки быть не должно','bad')),200)}}
function bindOpen(scope=document){scope.querySelectorAll('[data-view]').forEach(el=>{if(el.dataset.bound)return;el.dataset.bound='1';el.onclick=()=>openViewer(el.dataset.view,el.dataset.url,el.dataset.name)})}
function openViewer(type,url,name){closeSheet();const viewer=document.createElement('div');viewer.className='viewer';viewer.innerHTML=`<div class="viewerTop"><button class="iconBtn" id="viewerBack">‹</button><div class="viewerTitle">${esc(name||'Медиа')}</div></div><div class="viewerBody" id="viewerBody">${type==='image'?`<img src="${esc(url)}" alt="">`:type==='video'?`<video src="${esc(url)}" autoplay playsinline loop controlslist="nodownload noplaybackrate" preload="auto"></video>`:`<iframe src="${esc(url)}"></iframe>`}</div>`;document.body.appendChild(viewer);document.getElementById('viewerBack').onclick=()=>viewer.remove();const vid=viewer.querySelector('video');if(vid){vid.muted=false;vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{})})}let startY=0,drag=0;viewer.addEventListener('pointerdown',e=>{startY=e.clientY;drag=0;viewer.setPointerCapture(e.pointerId)});viewer.addEventListener('pointermove',e=>{drag=Math.max(0,e.clientY-startY);document.getElementById('viewerBody').style.setProperty('--drag',drag+'px')});viewer.addEventListener('pointerup',()=>{if(drag>95)viewer.remove();else document.getElementById('viewerBody')?.style.setProperty('--drag','0px')})}
function openSheet(){if(document.getElementById('sheet')){closeSheet();return}activeTab='gallery';selected=[];const d=document.createElement('div');d.id='sheet';d.className='sheetBackdrop';d.innerHTML=`<section class="sheet"><header class="sheetHead"><button id="sheetClose" class="iconBtn sheetClose">×</button><div id="sheetTitle" class="sheetTitle"></div><span></span></header><main id="sheetBody" class="sheetBody"></main><div id="sendDock" class="sendDock"><button id="sendFiles" class="sendBtn">Отправить</button></div><nav class="tabbar"><button class="tab active" data-tab="gallery">▣<span>Галерея</span></button><button class="tab" data-tab="location">⌖<span>Геопозиция</span></button><button class="tab" data-tab="contact">♙<span>Контакт</span></button><button class="tab" data-tab="docs">▤<span>Документы</span></button></nav></section>`;document.getElementById('app').appendChild(d);d.onclick=e=>{if(e.target===d)closeSheet()};d.querySelector('.sheet').onclick=e=>e.stopPropagation();document.getElementById('sheetClose').onclick=closeSheet;document.getElementById('sendFiles').onclick=sendSelected;d.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{activeTab=x.dataset.tab;renderSheet()});renderSheet()}
function closeSheet(){document.getElementById('sheet')?.remove()}
function renderSheet(){const b=document.getElementById('sheetBody'),t=document.getElementById('sheetTitle'),dock=document.getElementById('sendDock'),send=document.getElementById('sendFiles');if(!b)return;const title={gallery:'Недавние',location:'Геопозиция',contact:'Контакты',docs:'Документы'}[activeTab];t.innerHTML=`${title}<span class="sheetSub">${selected.length?'Выбрано: '+selected.length:'isolated media-v26'}</span>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));dock.classList.toggle('show',selected.length>0);send.textContent=selected.length?`Отправить ${selected.length} · ${size(selected.reduce((s,x)=>s+x.file.size,0))}`:'Отправить';if(activeTab==='gallery')b.innerHTML=galleryHtml();else if(activeTab==='docs')b.innerHTML=`<div class="panel"><button id="docBtn" class="panelAction"><span>▤</span><span><strong>Выбрать документ</strong><small>PDF, Word, архивы</small></span></button><button id="fileBtn" class="panelAction"><span>📁</span><span><strong>Выбрать из файлов</strong><small>Любой файл</small></span></button><button id="scanBtn" class="panelAction"><span>▣</span><span><strong>Сканировать документ</strong><small>Камера для скана</small></span></button></div>`;else b.innerHTML=`<div class="panel"><button class="panelAction"><span>⌁</span><span><strong>Заглушка лаборатории</strong><small>Здесь проверяем только медиа viewer.</small></span></button></div>`;bindSheet()}
function galleryHtml(){const media=selected.filter(x=>x.kind==='image'||x.kind==='video');const thumbs=media.map(x=>`<button class="tile thumb" data-rm="${esc(x.key)}">${x.kind==='video'?`<video src="${esc(x.url)}" muted autoplay loop playsinline></video><span class="mediaType">Видео</span>`:`<img src="${esc(x.url)}" alt="">`}<span class="check">✓</span></button>`).join('');return`<div class="galleryGrid"><button id="cameraTile" class="tile cameraTile">▣<span>Камера</span></button>${thumbs}${Array.from({length:Math.max(0,3-media.length)},()=>'<button class="tile emptyTile" data-open-gallery></button>').join('')}<button id="openGallery" class="tile galleryOpen">▣<span>Открыть галерею</span></button></div>`}
function bindSheet(){document.getElementById('cameraTile')?.addEventListener('click',()=>document.getElementById('cameraInput').click());document.getElementById('openGallery')?.addEventListener('click',()=>document.getElementById('galleryInput').click());document.querySelectorAll('[data-open-gallery]').forEach(x=>x.onclick=()=>document.getElementById('galleryInput').click());document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{selected=selected.filter(y=>y.key!==x.dataset.rm);renderSheet()});document.getElementById('docBtn')?.addEventListener('click',()=>document.getElementById('docInput').click());document.getElementById('fileBtn')?.addEventListener('click',()=>document.getElementById('fileInput').click());document.getElementById('scanBtn')?.addEventListener('click',()=>document.getElementById('cameraInput').click())}
function addSelected(files){for(const f of Array.from(files||[])){const key=f.name+':'+f.size+':'+f.lastModified;if(selected.some(x=>x.key===key))continue;const kind=classify(f),url=kind==='document'?'':URL.createObjectURL(f);selected.push({key,file:f,kind,url})}renderSheet()}
function sendSelected(){const arr=selected.slice();closeSheet();selected=[];for(const x of arr)addLocalFile(x.file)}
document.getElementById('attach').onclick=openSheet;document.getElementById('cam').onclick=()=>document.getElementById('cameraInput').click();document.getElementById('galleryInput').onchange=e=>{addSelected(e.target.files);e.target.value=''};document.getElementById('cameraInput').onchange=e=>{Array.from(e.target.files||[]).forEach(addLocalFile);e.target.value=''};document.getElementById('docInput').onchange=e=>{Array.from(e.target.files||[]).forEach(addLocalFile);e.target.value=''};document.getElementById('fileInput').onchange=e=>{Array.from(e.target.files||[]).forEach(addLocalFile);e.target.value=''};addDemo();
</script>
</body>
</html>
