<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Vision Talk</title>
<script src="./vendor/supabase-2.45.3.js"></script>
<style>
:root{
  color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;
  background:#070707;
  color:#fff;
  --chat-height:100dvh;
  --chat-top:0px;
}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;background:#070707}
body{margin:0;min-height:100vh}
body.chat-active{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
.app{max-width:760px;margin:0 auto;min-height:100vh}
body.chat-active .app{height:100%;min-height:0}
.card{margin:22vh 22px 0;padding:34px 28px;border:1px solid #303030;border-radius:28px;background:#151515}
.brand{color:#a8ffbd;font-size:18px;font-weight:800;letter-spacing:3px}
.title{font-size:42px;font-weight:800;margin:28px 0 10px}
.muted{color:#969696;font-size:20px;line-height:1.35}
.input{width:100%;background:#0b0b0b;border:1px solid #353535;border-radius:22px;color:#fff;font-size:20px;padding:22px 24px;margin-top:14px;outline:none}
.btn{border:0;border-radius:22px;background:#f5f5f5;color:#080808;font-size:20px;font-weight:800;padding:20px 24px;min-height:62px}
.btn.full{width:100%;margin-top:14px}
.error{color:#ffaaaa;margin-top:18px;font-size:18px}
.shell{min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 22px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}
.top h1{font-size:28px;margin:2px 0}
.topRight{display:flex;gap:22px;align-items:center;color:#bbb;font-size:19px}
.compose{display:flex;gap:12px;padding:28px}
.compose .input{margin:0;flex:1}
.plus{width:72px;flex:none;font-size:34px}
.dialog{margin:0 28px 14px;border:1px solid #2f2f2f;border-radius:24px;padding:22px 24px;background:#111;cursor:pointer}
.dialogLine{display:flex;align-items:center;justify-content:space-between;gap:14px}
.dialog .name{font-size:20px;font-weight:800}
.dialog .preview{color:#888;font-size:18px;margin-top:8px}
.badge{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:#f5f5f5;color:#111;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.empty{color:#777;padding:28px;font-size:20px}
.small{font-size:14px;color:#777;margin-top:12px}
.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:14px;z-index:50;background:#303030;max-width:calc(100vw - 24px);text-align:center}
.status.bad{background:#8b5a00}.status.good{background:#174d29}

.chatShell{
  position:fixed;
  top:var(--chat-top);
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  height:var(--chat-height);
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
  background:#070707;
  overscroll-behavior:none;
}
.chatTop{
  min-height:54px;
  display:grid;
  grid-template-columns:40px 36px minmax(0,1fr);
  align-items:center;
  gap:8px;
  padding:calc(5px + env(safe-area-inset-top)) 10px 5px;
  border-bottom:1px solid #242424;
  background:#090909;
  z-index:5;
}
.iconBtn{
  width:40px;
  height:40px;
  min-width:40px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.iconBtn:active{background:#1b1b1b}
.iconBtn svg{width:23px;height:23px;display:block}
.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#202020;
  border:1px solid #343434;
  color:#a8ffbd;
  font-size:16px;
  font-weight:800;
  text-transform:uppercase;
}
.chatIdentity{min-width:0;line-height:1.12}
.chatTitle{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatPresence{margin-top:3px;color:#8f8f8f;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages{
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:12px 12px 10px;
  scroll-padding-bottom:10px;
  background:#070707;
}
.row{display:flex;margin-bottom:8px}
.row.mine{justify-content:flex-end}
.bubble{max-width:82%;padding:11px 14px;border-radius:20px;background:#242424;font-size:18px;line-height:1.24;overflow-wrap:anywhere}
.mine .bubble{background:#efefef;color:#111}
.row.pending .bubble{opacity:.62}
.seq{display:block;font-size:12px;color:#888;margin-top:4px}
.pending .seq{color:#777}
.pendingSpinner{display:inline-block;width:11px;height:11px;border:2px solid #aaa;border-top-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{
  display:grid;
  grid-template-columns:40px minmax(0,1fr) 42px;
  align-items:end;
  gap:6px;
  min-height:52px;
  padding:6px 8px max(6px,env(safe-area-inset-bottom));
  border-top:1px solid #242424;
  background:#090909;
  z-index:10;
}
.chatShell.keyboardOpen .composer{padding-bottom:6px}
.composer .iconBtn{width:40px;height:40px;min-width:40px}
.composerPill{
  min-width:0;
  min-height:40px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 34px;
  align-items:center;
  border:1px solid #333;
  border-radius:21px;
  background:#111;
  padding-left:14px;
}
.messageInput{
  width:100%;
  min-width:0;
  height:38px;
  margin:0;
  padding:8px 4px 8px 0;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font:inherit;
  font-size:17px;
  line-height:22px;
}
.messageInput::placeholder{color:#777}
.innerAction{width:34px!important;height:38px!important;min-width:34px!important;color:#bdbdbd}
.innerAction svg{width:21px;height:21px}
.primaryAction{
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  border:1px solid #333;
  background:#151515;
}
.primaryAction.ready{background:#f5f5f5;color:#111;border-color:#f5f5f5}
.primaryAction svg{width:22px;height:22px}
.toolsSheet{
  position:absolute;
  left:8px;
  right:8px;
  bottom:calc(54px + max(6px,env(safe-area-inset-bottom)));
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding:10px;
  border:1px solid #303030;
  border-radius:18px;
  background:rgba(20,20,20,.98);
  box-shadow:0 12px 36px rgba(0,0,0,.45);
  z-index:20;
}
.chatShell.keyboardOpen .toolsSheet{bottom:58px}
.toolOption{min-width:0;border:0;border-radius:14px;background:#242424;color:#fff;padding:10px 6px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.toolOption svg{width:23px;height:23px}
.toolOption:active{background:#333}
@media (max-width:380px){.bubble{font-size:17px}.chatTop{grid-template-columns:38px 34px minmax(0,1fr);padding-left:6px;padding-right:6px}.avatar{width:34px;height:34px}.composer{grid-template-columns:38px minmax(0,1fr) 40px;padding-left:6px;padding-right:6px}}
</style>
</head>
<body>
<div id="root" class="app"><div class="card"><div class="brand">VISION TALK</div><div class="title">Загрузка…</div></div></div>
<script>
const SUPABASE_URL='https://ctcoqgsztdtsazdiwcmd.supabase.co';
const SUPABASE_KEY='sb_publishable_kMGqZAM2vadfXbBr8r5uzw_l9EiBtIw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById('root');
let session=null,profile=null,currentConversation=null,channel=null,realtimeStatus='CLOSED',autosyncTimer=null,lastRenderedSeq=0,renderedIds=new Set(),flushing=false,peerReadSeq=0,dialogsSignature='',keyboardStickBottom=true,viewportRaf=0,toolsOutsideHandler=null;
const QUEUE_KEY='vision-talk-outbox-v3';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();
const icons={
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 13 4h-2L9.5 6H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4.5Z"/><circle cx="12" cy="12.5" r="3.5"/></svg>`,
  mic:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>`,
  send:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg>`,
  photo:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>`,
  file:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>`
};
function showStatus(text,kind=''){let b=document.getElementById('netStatus');if(!b){b=document.createElement('div');b.id='netStatus';document.body.appendChild(b)}b.className='status '+kind;b.textContent=text;clearTimeout(showStatus.t);if(kind==='good')showStatus.t=setTimeout(()=>b.remove(),1800)}
function networkStatus(){if(!navigator.onLine)showStatus('Нет сети · новые сообщения останутся в очереди','bad')}
window.addEventListener('offline',networkStatus);
window.addEventListener('online',async()=>{showStatus('Сеть восстановлена · отправляю очередь','good');await flushQueue();if(currentConversation){await syncNewMessages(currentConversation,true);await markCurrentRead();await syncPeerRead()}else{await loadDialogs()}});
function queueGet(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch{return[]}}
function queuePut(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));updatePendingRows()}
function enqueue(m){const q=queueGet();if(!q.some(x=>x.client_message_id===m.client_message_id))q.push(m);queuePut(q)}
function dequeue(id){queuePut(queueGet().filter(x=>x.client_message_id!==id))}
function stopAutosync(){if(autosyncTimer){clearInterval(autosyncTimer);autosyncTimer=null}}
async function checkForNewMessages(){if(document.hidden||!navigator.onLine||!currentConversation)return;await syncNewMessages(currentConversation,false);await markCurrentRead();await syncPeerRead()}
function startAutosync(){stopAutosync();autosyncTimer=setInterval(checkForNewMessages,1500)}
function startDialogsAutosync(){stopAutosync();autosyncTimer=setInterval(()=>{if(!document.hidden&&navigator.onLine&&!currentConversation)loadDialogs()},1500)}
function pendingForConversation(cid){return queueGet().filter(m=>m.conversation_id===cid)}
function chatNearBottom(){const el=document.getElementById('messages');return !el||(el.scrollHeight-el.scrollTop-el.clientHeight)<=140}
function scrollChatBottom(){const el=document.getElementById('messages');if(el)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function setChatMode(active){document.body.classList.toggle('chat-active',active);if(!active){document.documentElement.style.setProperty('--chat-height','100dvh');document.documentElement.style.setProperty('--chat-top','0px')}}
function syncChatViewport(){viewportRaf=0;const shell=document.querySelector('.chatShell');if(!shell)return;const vv=window.visualViewport;const h=Math.max(320,Math.round(vv?vv.height:window.innerHeight));const top=Math.max(0,Math.round(vv?vv.offsetTop:0));document.documentElement.style.setProperty('--chat-height',h+'px');document.documentElement.style.setProperty('--chat-top',top+'px');const keyboardOpen=vv?vv.height<window.innerHeight-80:false;shell.classList.toggle('keyboardOpen',keyboardOpen);if(keyboardStickBottom)scrollChatBottom()}
function scheduleViewportSync(){if(viewportRaf)cancelAnimationFrame(viewportRaf);viewportRaf=requestAnimationFrame(syncChatViewport)}
if(window.visualViewport){window.visualViewport.addEventListener('resize',scheduleViewportSync);window.visualViewport.addEventListener('scroll',scheduleViewportSync)}
window.addEventListener('resize',scheduleViewportSync);
function appendPending(m,forceScroll=true){const el=document.getElementById('messages');if(!el||!currentConversation||m.conversation_id!==currentConversation.id)return;const domId='pending-'+m.client_message_id;if(document.getElementById(domId)||renderedIds.has(m.client_message_id))return;const wasNearBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<=140;const row=document.createElement('div');row.id=domId;row.className='row mine pending';const bubble=document.createElement('div');bubble.className='bubble';bubble.appendChild(document.createTextNode(m.body??''));const seq=document.createElement('span');seq.className='seq';const spinner=document.createElement('span');spinner.className='pendingSpinner';spinner.setAttribute('aria-label','отправка');seq.appendChild(spinner);bubble.appendChild(seq);row.appendChild(bubble);el.appendChild(row);if(forceScroll||wasNearBottom)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function updatePendingRows(){if(!currentConversation)return;const ids=new Set(pendingForConversation(currentConversation.id).map(m=>m.client_message_id));document.querySelectorAll('.row.pending[id^="pending-"]').forEach(row=>{const id=row.id.slice(8);if(!ids.has(id))row.remove()});for(const m of pendingForConversation(currentConversation.id))appendPending(m,false)}
function metaText(seq,mine){return '#'+seq+(mine?(Number(seq)<=peerReadSeq?' · ✓✓':' · ✓'):'')}
function refreshReadMarks(){document.querySelectorAll('#messages .row.mine:not(.pending)').forEach(row=>{const seqNum=Number(row.dataset.seq||0);const seq=row.querySelector('.seq');if(seq&&seqNum)seq.textContent=metaText(seqNum,true)})}
async function markCurrentRead(){if(document.hidden||!navigator.onLine||!currentConversation||!lastRenderedSeq)return;await sb.rpc('mark_conversation_read',{p_conversation_id:currentConversation.id,p_last_read_seq:lastRenderedSeq})}
async function syncPeerRead(){if(!currentConversation||!session)return;const {data,error}=await sb.from('conversation_members').select('last_read_seq').eq('conversation_id',currentConversation.id).neq('user_id',session.user.id).limit(1).maybeSingle();if(error||!data)return;const next=Number(data.last_read_seq||0);if(next!==peerReadSeq){peerReadSeq=next;refreshReadMarks()}}
async function flushQueue(){if(flushing||!navigator.onLine||!session)return;flushing=true;try{const q=queueGet();if(!q.length)return;let sent=0;for(const m of [...q]){const {data,error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error){showStatus('Очередь остановлена · повторю при следующем соединении','bad');break}if(data&&currentConversation?.id===m.conversation_id)appendMessages([data],true);dequeue(m.client_message_id);sent++}if(sent){showStatus(sent===1?'Сообщение доставлено':`Доставлено из очереди: ${sent}`,'good');if(currentConversation){await syncNewMessages(currentConversation,true);await markCurrentRead();await syncPeerRead()}else{await loadDialogs()}}}finally{flushing=false}}
async function boot(){const {data}=await sb.auth.getSession();session=data.session;if(!session)return renderLogin();const {data:p,error}=await sb.from('profiles').select('id,username,display_name,is_approved').eq('id',session.user.id).single();if(error)return renderFatal(error.message);profile=p;if(!profile.is_approved)return renderFatal('Ожидается доступ: администратор должен включить is_approved для @'+profile.username);await renderDialogs();flushQueue()}
function renderLogin(msg=''){stopAutosync();setChatMode(false);root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Вход</div><div class="muted">Закрытый мессенджер · стабильный MVP</div><input id="email" class="input" type="email" placeholder="email"><input id="password" class="input" type="password" placeholder="пароль"><button id="login" class="btn full">Войти</button><div id="err" class="error">${esc(msg)}</div><div class="small">stable-origin · tools-v14</div></div>`;document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('err').textContent=error.message;boot()}}
function renderFatal(msg){stopAutosync();setChatMode(false);root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Ошибка</div><div class="muted">${esc(msg)}</div><button class="btn full" id="out">Выйти</button></div>`;document.getElementById('out').onclick=async()=>{await sb.auth.signOut();renderLogin()}}
async function renderDialogs(){stopAutosync();setChatMode(false);currentConversation=null;lastRenderedSeq=0;peerReadSeq=0;dialogsSignature='';renderedIds.clear();if(channel){await sb.removeChannel(channel);channel=null}root.innerHTML=`<div class="shell"><div class="top"><div><div class="brand">VISION TALK</div><h1>Диалоги</h1></div><div class="topRight"><span>@${esc(profile.username)}</span><span id="logout">Выйти</span></div></div><div class="compose"><input id="username" class="input" placeholder="username"><button id="start" class="btn plus">+</button></div><div id="startErr" class="error" style="padding:0 28px"></div><div id="dialogs"></div><div class="small" style="padding:0 28px 24px">Vision talk · tools-v14</div></div>`;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();session=null;renderLogin()};document.getElementById('start').onclick=async()=>{const u=document.getElementById('username').value.trim().replace(/^@/,'');if(!u)return;const {data,error}=await sb.rpc('start_direct_conversation',{target_username:u});if(error)return document.getElementById('startErr').textContent=error.message;openConversation(data,u)};await loadDialogs();startDialogsAutosync()}
async function loadDialogs(){const el=document.getElementById('dialogs');if(!el)return;const {data,error}=await sb.rpc('my_conversations_v2');if(error){el.innerHTML=`<div class="error" style="padding:28px">${esc(error.message)}</div>`;return}if(!data?.length){dialogsSignature='empty';el.innerHTML='<div class="empty">Диалогов пока нет.</div>';return}const sig=JSON.stringify(data.map(d=>[d.id,d.last_message,d.last_seq,d.last_read_seq,d.unread_count]));if(sig===dialogsSignature)return;dialogsSignature=sig;el.innerHTML=data.map(d=>{const unread=Number(d.unread_count||0);return `<div class="dialog" data-id="${d.id}" data-title="${esc(d.title||'Диалог')}"><div class="dialogLine"><div class="name">${esc(d.title||'Диалог')}</div>${unread>0?`<div class="badge">${unread>99?'99+':unread}</div>`:''}</div><div class="preview">${esc(d.last_message||'')}</div></div>`}).join('');el.querySelectorAll('.dialog').forEach(x=>x.onclick=()=>openConversation(x.dataset.id,x.dataset.title))}
function avatarLetter(title){return String(title||'?').replace(/^@/,'').trim().charAt(0)||'?'}
function closeTools(){const sheet=document.getElementById('composerTools');if(sheet)sheet.remove();if(toolsOutsideHandler){document.removeEventListener('pointerdown',toolsOutsideHandler,true);toolsOutsideHandler=null}}
function openTools(){const existing=document.getElementById('composerTools');if(existing){closeTools();return}const shell=document.querySelector('.chatShell');if(!shell)return;const sheet=document.createElement('div');sheet.id='composerTools';sheet.className='toolsSheet';sheet.innerHTML=`<button class="toolOption" data-tool="media">${icons.photo}<span>Фото/видео</span></button><button class="toolOption" data-tool="camera">${icons.camera}<span>Камера</span></button><button class="toolOption" data-tool="file">${icons.file}<span>Файл</span></button>`;shell.appendChild(sheet);sheet.querySelectorAll('.toolOption').forEach(btn=>btn.onclick=()=>{closeTools();showStatus('Вложения подключаем отдельным следующим блоком')});requestAnimationFrame(()=>{toolsOutsideHandler=event=>{const activeSheet=document.getElementById('composerTools'),attach=document.getElementById('attach');if(!activeSheet){closeTools();return}if(activeSheet.contains(event.target)||attach?.contains(event.target))return;closeTools()};document.addEventListener('pointerdown',toolsOutsideHandler,true)})}
function syncComposerAction(){const input=document.getElementById('message'),action=document.getElementById('primaryAction');if(!input||!action)return;const ready=Boolean(input.value.trim());action.classList.toggle('ready',ready);action.innerHTML=ready?icons.send:icons.mic;action.setAttribute('aria-label',ready?'Отправить':'Голосовое сообщение')}
async function openConversation(id,title){stopAutosync();setChatMode(true);lastRenderedSeq=0;peerReadSeq=0;renderedIds.clear();currentConversation={id,title};root.innerHTML=`<div class="chatShell"><div class="chatTop"><button id="back" class="iconBtn" aria-label="Назад">${icons.back}</button><div class="avatar">${esc(avatarLetter(title))}</div><div class="chatIdentity"><div class="chatTitle">${esc(title||'Диалог')}</div><div class="chatPresence">Vision Talk · в сети</div></div></div><div id="messages" class="messages"></div><div class="composer"><button id="attach" class="iconBtn" aria-label="Вложения">${icons.plus}</button><div class="composerPill"><input id="message" class="messageInput" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Сообщение"><button id="camera" class="iconBtn innerAction" aria-label="Камера">${icons.camera}</button></div><button id="primaryAction" class="iconBtn primaryAction" aria-label="Голосовое сообщение">${icons.mic}</button></div></div>`;document.getElementById('back').onclick=()=>{closeTools();stopAutosync();currentConversation=null;renderDialogs()};const input=document.getElementById('message'),action=document.getElementById('primaryAction'),attach=document.getElementById('attach'),camera=document.getElementById('camera');attach.onclick=openTools;camera.onclick=()=>showStatus('Камеру подключаем отдельным следующим блоком');action.addEventListener('pointerdown',e=>e.preventDefault());action.onclick=()=>{if(input.value.trim())sendCurrent();else showStatus('Голосовые сообщения подключаем отдельным следующим блоком')};input.addEventListener('input',syncComposerAction);input.addEventListener('focus',()=>{closeTools();keyboardStickBottom=chatNearBottom();scheduleViewportSync();setTimeout(scheduleViewportSync,120);setTimeout(scheduleViewportSync,320)});input.addEventListener('blur',()=>{setTimeout(()=>{keyboardStickBottom=chatNearBottom();scheduleViewportSync()},80)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCurrent()}});await loadInitialMessages(currentConversation);for(const m of pendingForConversation(id))appendPending(m,false);await markCurrentRead();await syncPeerRead();subscribeMessages(id);startAutosync();syncComposerAction();scheduleViewportSync();setTimeout(scheduleViewportSync,160);if(navigator.onLine)flushQueue()}
async function loadInitialMessages(conv){if(!conv||currentConversation?.id!==conv.id)return;const {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body,created_at').eq('conversation_id',conv.id).order('server_seq',{ascending:true});const el=document.getElementById('messages');if(!el)return;if(error){el.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}renderedIds.clear();el.textContent='';appendMessages(data||[],true)}
async function syncNewMessages(conv,forceScroll=false){if(!conv||currentConversation?.id!==conv.id)return;const {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body,created_at').eq('conversation_id',conv.id).gt('server_seq',lastRenderedSeq).order('server_seq',{ascending:true});if(error||currentConversation?.id!==conv.id)return;if(data?.length)appendMessages(data,forceScroll);updatePendingRows()}
function insertConfirmedRow(el,row,seq){row.dataset.seq=String(seq);let before=null;for(const child of el.children){if(child===row)continue;if(child.classList.contains('pending')){before=child;break}const childSeq=Number(child.dataset.seq||0);if(childSeq&&childSeq>Number(seq)){before=child;break}}if(before)el.insertBefore(row,before);else el.appendChild(row)}
function appendMessages(list,forceScroll=false){const el=document.getElementById('messages');if(!el)return;const wasNearBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<=140;let changed=0;for(const m of list){const key=m.client_message_id||m.id;if(renderedIds.has(key))continue;const pending=document.getElementById('pending-'+key);const mine=m.sender_id===session.user.id;renderedIds.add(key);lastRenderedSeq=Math.max(lastRenderedSeq,Number(m.server_seq||0));if(pending){pending.removeAttribute('id');pending.classList.remove('pending');pending.dataset.mine='1';const bubble=pending.querySelector('.bubble');bubble.textContent='';bubble.appendChild(document.createTextNode(m.body??''));const seq=document.createElement('span');seq.className='seq';seq.textContent=metaText(m.server_seq,true);bubble.appendChild(seq);insertConfirmedRow(el,pending,m.server_seq);changed++;continue}const row=document.createElement('div');row.className='row '+(mine?'mine':'');row.dataset.mine=mine?'1':'0';const bubble=document.createElement('div');bubble.className='bubble';bubble.appendChild(document.createTextNode(m.body??''));const seq=document.createElement('span');seq.className='seq';seq.textContent=metaText(m.server_seq,mine);bubble.appendChild(seq);row.appendChild(bubble);insertConfirmedRow(el,row,m.server_seq);changed++}if(!changed)return;if(forceScroll||wasNearBottom)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function subscribeMessages(cid){if(channel)sb.removeChannel(channel);channel=sb.channel('conversation:'+cid+'-'+uuid()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},async payload=>{if(currentConversation?.id===cid&&payload?.new){appendMessages([payload.new],false);await markCurrentRead()}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversation_members',filter:'conversation_id=eq.'+cid},payload=>{if(currentConversation?.id===cid&&payload?.new&&payload.new.user_id!==session.user.id){peerReadSeq=Number(payload.new.last_read_seq||0);refreshReadMarks()}}).subscribe(status=>{realtimeStatus=status;if(status==='SUBSCRIBED')showStatus('Realtime подключён','good');else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')showStatus('Realtime: '+status,'bad')})}
async function sendCurrent(){const input=document.getElementById('message');if(!input||!currentConversation)return;const body=input.value.trim();if(!body)return;input.value='';syncComposerAction();keyboardStickBottom=true;closeTools();const m={conversation_id:currentConversation.id,client_message_id:uuid(),body,created_at:Date.now()};enqueue(m);appendPending(m,true);if(document.activeElement!==input){try{input.focus({preventScroll:true})}catch{input.focus()}}if(!navigator.onLine){showStatus('Нет сети · сообщение сохранено','bad');return}const {data,error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error){showStatus('Отправка отложена · сохранено в очереди','bad');return}if(data)appendMessages([data],true);dequeue(m.client_message_id);await syncNewMessages(currentConversation,true);await syncPeerRead()}
sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='SIGNED_OUT')renderLogin()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(currentConversation){scheduleViewportSync();syncNewMessages(currentConversation,false);markCurrentRead();syncPeerRead();if(navigator.onLine)flushQueue()}else{loadDialogs();if(navigator.onLine)flushQueue()}});
window.addEventListener('unhandledrejection',event=>{console.error(event.reason);showStatus('Ошибка интерфейса · повторите действие','bad')});
boot().catch(error=>renderFatal(error?.message||String(error)));
</script>
</body>
</html>
