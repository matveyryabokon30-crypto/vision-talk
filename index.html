<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Vision Talk</title>
<link rel="preload" href="./app-v13.html?base=022cfe2" as="fetch" crossorigin>
<link rel="preload" href="./attachments-v14.css?v=media-v19" as="style">
<link rel="preload" href="./media-transport-v17.css?v=media-v19" as="style">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:#070707;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070707}
.loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loaderCard{width:min(100%,700px);padding:34px 28px;border:1px solid #303030;border-radius:28px;background:#151515}
.loaderBrand{color:#a8ffbd;font-size:18px;font-weight:800;letter-spacing:3px}
.loaderTitle{font-size:42px;font-weight:800;margin:28px 0 10px}
.loaderText{color:#949494;font-size:17px;line-height:1.4}
.loaderRetry{display:none;width:100%;margin-top:20px;border:0;border-radius:18px;background:#f4f4f4;color:#111;padding:16px;font:inherit;font-size:18px;font-weight:800}
.loaderRetry.visible{display:block}
</style>
</head>
<body>
<div class="loader" id="bootLoader"><div class="loaderCard"><div class="loaderBrand">VISION TALK</div><div class="loaderTitle">Загрузка…</div><div class="loaderText" id="bootText">Запускаю защищённый мессенджер</div><button class="loaderRetry" id="bootRetry">Повторить</button></div></div>
<script>
(()=>{
  'use strict';
  const BUILD='media-v19';
  const status=document.getElementById('bootText');
  const retry=document.getElementById('bootRetry');

  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const timeout=(promise,ms,label)=>Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label||'timeout')),ms))
  ]);

  async function fetchBase(){
    const urls=['./app-v13.html?base=022cfe2','./app-v13.html?base=022cfe2&retry=1'];
    let lastError;
    for(let attempt=0;attempt<urls.length;attempt++){
      try{
        status.textContent=attempt?'Повторно загружаю интерфейс…':'Загружаю интерфейс…';
        const response=await timeout(fetch(urls[attempt],{cache:attempt?'reload':'force-cache'}),12000,'Интерфейс не ответил');
        if(!response.ok)throw new Error('HTTP '+response.status);
        const text=await response.text();
        if(!text.includes('id="root"')||!text.includes('SUPABASE_URL'))throw new Error('Повреждённый интерфейс');
        return text;
      }catch(error){
        lastError=error;
        await wait(500);
      }
    }
    throw lastError||new Error('Не удалось загрузить интерфейс');
  }

  function addStyle(href){
    if(document.querySelector(`link[href="${href}"]`))return;
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href=href;
    document.head.appendChild(link);
  }

  function runExternal(src,fallback){
    return new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=src;
      script.async=false;
      script.onload=resolve;
      script.onerror=()=>{
        script.remove();
        if(!fallback)return reject(new Error('Не загрузилась библиотека'));
        const alt=document.createElement('script');
        alt.src=fallback;
        alt.async=false;
        alt.onload=resolve;
        alt.onerror=()=>reject(new Error('Не загрузилась библиотека'));
        document.head.appendChild(alt);
      };
      document.head.appendChild(script);
    });
  }

  function runInline(code){
    const script=document.createElement('script');
    script.textContent=code;
    document.body.appendChild(script);
  }

  function runFile(src){
    return new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=src;
      script.async=false;
      script.onload=resolve;
      script.onerror=()=>reject(new Error('Не загрузился модуль '+src));
      document.body.appendChild(script);
    });
  }

  async function start(){
    retry.classList.remove('visible');
    try{
      const source=await fetchBase();
      const parsed=new DOMParser().parseFromString(source,'text/html');
      const scripts=[...parsed.querySelectorAll('script')].map(node=>({src:node.getAttribute('src'),code:node.textContent||''}));
      parsed.querySelectorAll('script').forEach(node=>node.remove());

      for(const style of parsed.head.querySelectorAll('style'))document.head.appendChild(style.cloneNode(true));
      addStyle(`./attachments-v14.css?v=${BUILD}`);
      addStyle(`./media-transport-v17.css?v=${BUILD}`);

      status.textContent='Подключаю защищённое соединение…';
      document.body.innerHTML=parsed.body.innerHTML;

      for(const item of scripts){
        if(item.src){
          const absolute=new URL(item.src,location.href).href;
          const fallback=absolute.includes('cdn.jsdelivr.net/npm/@supabase/supabase-js')
            ? 'https://unpkg.com/@supabase/supabase-js@2'
            : null;
          await timeout(runExternal(absolute,fallback),15000,'Библиотека не ответила');
        }else if(item.code.trim()){
          runInline(item.code);
        }
      }

      await runFile(`./runtime-hotfix-v18.js?v=${BUILD}`);
      await runFile(`./media-transport-v17.js?v=${BUILD}`);
    }catch(error){
      console.error('Vision Talk boot failed',error);
      document.body.innerHTML='<div class="loader"><div class="loaderCard"><div class="loaderBrand">VISION TALK</div><div class="loaderTitle">Не удалось запустить</div><div class="loaderText" id="bootText"></div><button class="loaderRetry visible" id="bootRetry">Повторить</button></div></div>';
      document.getElementById('bootText').textContent=error?.message||String(error);
      document.getElementById('bootRetry').onclick=()=>location.reload();
    }
  }

  retry.onclick=()=>start();
  start();
})();
</script>
</body>
</html>
