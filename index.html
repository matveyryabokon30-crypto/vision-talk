<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vision Talk</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:#070707;color:#fff}*{box-sizing:border-box}body{margin:0;background:#070707;min-height:100vh}.app{max-width:760px;margin:auto;min-height:100vh}.card{margin:22vh 22px 0;padding:34px 28px;border:1px solid #303030;border-radius:28px;background:#151515}.brand{color:#a8ffbd;font-size:18px;font-weight:800;letter-spacing:3px}.title{font-size:42px;font-weight:800;margin:28px 0 10px}.muted{color:#969696;font-size:20px}.input{width:100%;background:#0b0b0b;border:1px solid #353535;border-radius:22px;color:#fff;font-size:20px;padding:22px 24px;margin-top:14px;outline:none}.btn{border:0;border-radius:22px;background:#f5f5f5;color:#080808;font-size:20px;font-weight:800;padding:20px 24px;min-height:62px}.btn.full{width:100%;margin-top:14px}.error{color:#ffaaaa;margin-top:18px}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 22px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.top h1{font-size:28px;margin:2px 0}.topRight{display:flex;gap:22px;align-items:center;color:#bbb}.compose{display:flex;gap:12px;padding:28px}.compose .input{margin:0;flex:1}.plus{width:72px;flex:none;font-size:34px}.dialog{margin:0 28px 14px;border:1px solid #2f2f2f;border-radius:24px;padding:20px 22px;background:#111;cursor:pointer}.dialogLine{display:flex;align-items:center;justify-content:space-between;gap:14px}.dialog .name{font-size:20px;font-weight:800;min-width:0}.dialogMeta{display:flex;align-items:center;gap:10px;flex:none}.time{font-size:14px;color:#777;white-space:nowrap}.preview{color:#888;font-size:18px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:#f5f5f5;color:#111;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}.chatTop{display:flex;align-items:center;gap:16px;padding:22px 28px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.back{font-size:34px;cursor:pointer}.chatTitle{font-weight:800;font-size:22px}.messages{padding:28px 28px 120px}.row{display:flex;margin-bottom:14px}.row.mine{justify-content:flex-end}.bubble{max-width:78%;padding:17px 20px;border-radius:25px;background:#242424;font-size:20px;line-height:1.22}.mine .bubble{background:#efefef;color:#111}.row.pending .bubble{opacity:.62}.seq{display:block;font-size:14px;color:#888;margin-top:5px}.pendingSpinner{display:inline-block;width:12px;height:12px;border:2px solid #aaa;border-top-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;background:#070707;border-top:1px solid #272727}.composer .input{margin:0}.send{width:68px;flex:none;font-size:30px}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:14px;z-index:20;background:#303030}.status.bad{background:#8b5a00}.status.good{background:#174d29}.empty{color:#777;padding:28px}.small{font-size:14px;color:#777;margin-top:12px}
</style></head><body><div id="root" class="app"></div><script>
const URL='https://ctcoqgsztdtsazdiwcmd.supabase.co',KEY='sb_publishable_kMGqZAM2vadfXbBr8r5uzw_l9EiBtIw';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),root=document.getElementById('root');
let session=null,profile=null,current=null,channel=null,timer=null,lastSeq=0,rendered=new Set(),flushing=false,peerRead=0,dialogChannel=null;
const Q='vision-talk-outbox-v3',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uuid=()=>crypto.randomUUID();
function status(t,k=''){let b=document.getElementById('netStatus');if(!b){b=document.createElement('div');b.id='netStatus';document.body.appendChild(b)}b.className='status '+k;b.textContent=t;clearTimeout(status.t);if(k==='good')status.t=setTimeout(()=>b.remove(),1600)}
function qget(){try{return JSON.parse(localStorage.getItem(Q)||'[]')}catch{return[]}}function qput(q){localStorage.setItem(Q,JSON.stringify(q));updatePending()}function enqueue(m){let q=qget();if(!q.some(x=>x.client_message_id===m.client_message_id))q.push(m);qput(q)}function dequeue(id){qput(qget().filter(x=>x.client_message_id!==id))}
window.addEventListener('offline',()=>status('Нет сети · сообщения остаются в очереди','bad'));window.addEventListener('online',async()=>{status('Сеть восстановлена','good');await flush();if(current){await sync(current,true);await markRead();await syncPeer()}else await syncDialogs()});
function stopTimer(){if(timer){clearInterval(timer);timer=null}}function startChatTimer(){stopTimer();timer=setInterval(()=>{if(!document.hidden&&navigator.onLine&&current){sync(current,false);markRead();syncPeer()}},1500)}function startDialogTimer(){stopTimer();timer=setInterval(()=>{if(!document.hidden&&navigator.onLine&&!current)syncDialogs()},2500)}
function pending(cid){return qget().filter(x=>x.conversation_id===cid)}
function addPending(m,scroll=true){let el=document.getElementById('messages');if(!el||!current||m.conversation_id!==current.id||document.getElementById('pending-'+m.client_message_id)||rendered.has(m.client_message_id))return;let r=document.createElement('div');r.id='pending-'+m.client_message_id;r.className='row mine pending';let b=document.createElement('div');b.className='bubble';b.append(document.createTextNode(m.body||''));let s=document.createElement('span');s.className='seq';let sp=document.createElement('span');sp.className='pendingSpinner';s.append(sp);b.append(s);r.append(b);el.append(r);if(scroll)requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}
function updatePending(){if(!current)return;let ids=new Set(pending(current.id).map(x=>x.client_message_id));document.querySelectorAll('.row.pending[id^="pending-"]').forEach(r=>{if(!ids.has(r.id.slice(8)))r.remove()});pending(current.id).forEach(x=>addPending(x,false))}
function meta(seq,mine){return '#'+seq+(mine?(Number(seq)<=peerRead?' · ✓✓':' · ✓'):'')}function refreshReads(){document.querySelectorAll('#messages .row.mine:not(.pending)').forEach(r=>{let n=Number(r.dataset.seq||0),s=r.querySelector('.seq');if(n&&s)s.textContent=meta(n,true)})}
async function markRead(){if(document.hidden||!navigator.onLine||!current||!lastSeq)return;await sb.rpc('mark_conversation_read',{p_conversation_id:current.id,p_last_read_seq:lastSeq})}
async function syncPeer(){if(!current||!session)return;let {data,error}=await sb.from('conversation_members').select('last_read_seq').eq('conversation_id',current.id).neq('user_id',session.user.id).limit(1).maybeSingle();if(!error&&data){let n=Number(data.last_read_seq||0);if(n!==peerRead){peerRead=n;refreshReads()}}}
async function flush(){if(flushing||!navigator.onLine||!session)return;flushing=true;try{for(const m of [...qget()]){let {data,error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error)break;if(data&&current?.id===m.conversation_id)addMessages([data],true);dequeue(m.client_message_id)}if(current){await sync(current,true);await markRead();await syncPeer()}else await syncDialogs()}finally{flushing=false}}
async function boot(){let {data}=await sb.auth.getSession();session=data.session;if(!session)return login();let {data:p,error}=await sb.from('profiles').select('id,username,is_approved').eq('id',session.user.id).single();if(error)return fatal(error.message);profile=p;if(!p.is_approved)return fatal('Ожидается доступ');await dialogs();flush()}
function login(msg=''){stopTimer();root.innerHTML=`<div class=card><div class=brand>VISION TALK</div><div class=title>Вход</div><div class=muted>Закрытый мессенджер</div><input id=e class=input type=email placeholder=email><input id=p class=input type=password placeholder=пароль><button id=l class="btn full">Войти</button><div id=er class=error>${esc(msg)}</div><div class=small>stable-origin · dialogs-v11</div></div>`;l.onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(error)er.textContent=error.message;else boot()}}
function fatal(x){root.innerHTML=`<div class=card><div class=title>Ошибка</div><div>${esc(x)}</div></div>`}
function fmtTime(v){if(!v)return'';let d=new Date(v),now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});let y=new Date(now);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'вчера';return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}
function ensureDialog(d){let list=document.getElementById('dialogs');if(!list)return;let id='dialog-'+d.id,row=document.getElementById(id);if(!row){row=document.createElement('div');row.id=id;row.className='dialog';row.onclick=()=>openChat(d.id,d.title||'Диалог');row.innerHTML='<div class="dialogLine"><div class="name"></div><div class="dialogMeta"><span class="time"></span><span class="badge" hidden></span></div></div><div class="preview"></div>'}row.dataset.activity=d.last_message_at||'';row.querySelector('.name').textContent=d.title||'Диалог';row.querySelector('.preview').textContent=d.last_message||'';row.querySelector('.time').textContent=fmtTime(d.last_message_at);let badge=row.querySelector('.badge'),u=Number(d.unread_count||0);badge.hidden=!u;badge.textContent=u>99?'99+':String(u);let before=[...list.children].find(x=>x!==row&&(x.dataset.activity||'')<(row.dataset.activity||''));if(before)list.insertBefore(row,before);else if(row.parentNode!==list)list.append(row);else list.append(row)}
async function syncDialogs(){let list=document.getElementById('dialogs');if(!list)return;let {data,error}=await sb.rpc('my_conversations_v3');if(error){list.innerHTML=`<div class=error style="padding:28px">${esc(error.message)}</div>`;return}if(!data?.length){list.innerHTML='<div class=empty>Диалогов пока нет.</div>';return}list.querySelector('.empty')?.remove();let alive=new Set(data.map(d=>'dialog-'+d.id));[...list.children].forEach(x=>{if(x.id?.startsWith('dialog-')&&!alive.has(x.id))x.remove()});data.forEach(ensureDialog)}
async function dialogs(){stopTimer();current=null;lastSeq=0;peerRead=0;rendered.clear();if(channel){await sb.removeChannel(channel);channel=null}if(dialogChannel){await sb.removeChannel(dialogChannel);dialogChannel=null}root.innerHTML=`<div class=top><div><div class=brand>VISION TALK</div><h1>Диалоги</h1></div><div class=topRight><span>@${esc(profile.username)}</span><span id=lo>Выйти</span></div></div><div class=compose><input id=u class=input placeholder=username><button id=st class="btn plus">+</button></div><div id=startErr class=error style="padding:0 28px"></div><div id=dialogs></div><div class=small style="padding:0 28px 24px">Vision talk · dialogs-v11</div>`;lo.onclick=async()=>{await sb.auth.signOut();login()};st.onclick=async()=>{let x=u.value.trim().replace(/^@/,'');if(!x)return;let {data,error}=await sb.rpc('start_direct_conversation',{target_username:x});if(error)return startErr.textContent=error.message;openChat(data,x)};await syncDialogs();dialogChannel=sb.channel('dialog-list:'+uuid()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>syncDialogs()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversation_members',filter:'user_id=eq.'+session.user.id},()=>syncDialogs()).subscribe();startDialogTimer()}
async function openChat(id,title){stopTimer();if(dialogChannel){await sb.removeChannel(dialogChannel);dialogChannel=null}lastSeq=0;peerRead=0;rendered.clear();current={id,title};root.innerHTML=`<div class=chatTop><div id=back class=back>‹</div><div><div class=chatTitle>${esc(title)}</div><div class=small>Vision talk · dialogs-v11</div></div></div><div id=messages class=messages></div><div class=composer><input id=m class=input placeholder=Сообщение><button id=send class="btn send">↑</button></div>`;back.onclick=dialogs;send.onclick=sendNow;m.addEventListener('keydown',e=>{if(e.key==='Enter')sendNow()});await initial();pending(id).forEach(x=>addPending(x,false));await markRead();await syncPeer();sub(id);startChatTimer();if(navigator.onLine)flush()}
async function initial(){let {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body').eq('conversation_id',current.id).order('server_seq');if(error)return;document.getElementById('messages').textContent='';rendered.clear();addMessages(data||[],true)}
async function sync(c,scroll=false){if(!c||current?.id!==c.id)return;let {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body').eq('conversation_id',c.id).gt('server_seq',lastSeq).order('server_seq');if(!error&&data?.length)addMessages(data,scroll);updatePending()}
function insertRow(el,row,seq){row.dataset.seq=String(seq);let before=[...el.children].find(x=>x!==row&&(x.classList.contains('pending')||Number(x.dataset.seq||0)>Number(seq)));before?el.insertBefore(row,before):el.append(row)}
function addMessages(list,scroll=false){let el=document.getElementById('messages');if(!el)return,near=(innerHeight+scrollY)>=document.body.scrollHeight-140,changed=false;for(const x of list){let k=x.client_message_id||x.id;if(rendered.has(k))continue;let p=document.getElementById('pending-'+k),mine=x.sender_id===session.user.id;rendered.add(k);lastSeq=Math.max(lastSeq,Number(x.server_seq||0));let row=p||document.createElement('div');row.className='row '+(mine?'mine':'');row.dataset.mine=mine?'1':'0';row.removeAttribute('id');let b=p?p.querySelector('.bubble'):document.createElement('div');b.className='bubble';b.textContent='';b.append(document.createTextNode(x.body||''));let s=document.createElement('span');s.className='seq';s.textContent=meta(x.server_seq,mine);b.append(s);if(!p)row.append(b);insertRow(el,row,x.server_seq);changed=true}if(changed&&(scroll||near))requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}
function sub(cid){if(channel)sb.removeChannel(channel);channel=sb.channel('chat:'+cid+':'+uuid()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},async p=>{if(current?.id===cid&&p.new){addMessages([p.new],false);await markRead()}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversation_members',filter:'conversation_id=eq.'+cid},p=>{if(current?.id===cid&&p.new&&p.new.user_id!==session.user.id){peerRead=Number(p.new.last_read_seq||0);refreshReads()}}).subscribe()}
async function sendNow(){let input=document.getElementById('m');if(!input||!current)return;let body=input.value.trim();if(!body)return;input.value='';let x={conversation_id:current.id,client_message_id:uuid(),body,created_at:Date.now()};enqueue(x);addPending(x,true);if(!navigator.onLine){status('Нет сети · сообщение сохранено','bad');return}let {data,error}=await sb.rpc('send_message',{p_conversation_id:x.conversation_id,p_client_message_id:x.client_message_id,p_type:'text',p_body:x.body,p_attachment_path:null});if(error){status('Отправка отложена','bad');return}if(data)addMessages([data],true);dequeue(x.client_message_id);await sync(current,true);await syncPeer()}
sb.auth.onAuthStateChange((e,s)=>{session=s;if(e==='SIGNED_OUT')login()});document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(current){sync(current,false);markRead();syncPeer();if(navigator.onLine)flush()}else{syncDialogs();if(navigator.onLine)flush()}});boot();
</script></body></html>
