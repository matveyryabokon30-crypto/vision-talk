<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vision Talk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:#070707;color:#fff}*{box-sizing:border-box}body{margin:0;background:#070707;min-height:100vh}.app{max-width:760px;margin:auto;min-height:100vh}.card{margin:22vh 22px 0;padding:34px 28px;border:1px solid #303030;border-radius:28px;background:#151515}.brand{color:#a8ffbd;font-size:18px;font-weight:800;letter-spacing:3px}.title{font-size:42px;font-weight:800;margin:28px 0 10px}.muted{color:#969696;font-size:20px;line-height:1.35}.input{width:100%;background:#0b0b0b;border:1px solid #353535;border-radius:22px;color:#fff;font-size:20px;padding:22px 24px;margin-top:14px;outline:none}.btn{border:0;border-radius:22px;background:#f5f5f5;color:#080808;font-size:20px;font-weight:800;padding:20px 24px;min-height:62px}.btn.full{width:100%;margin-top:14px}.error{color:#ffaaaa;margin-top:18px;font-size:18px}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 22px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.top h1{font-size:28px;margin:2px 0}.topRight{display:flex;gap:22px;align-items:center;color:#bbb;font-size:19px}.compose{display:flex;gap:12px;padding:28px}.compose .input{margin:0;flex:1}.plus{width:72px;flex:none;font-size:34px}.dialog{margin:0 28px 14px;border:1px solid #2f2f2f;border-radius:24px;padding:22px 24px;background:#111}.dialog .name{font-size:20px;font-weight:800}.dialog .preview{color:#888;font-size:18px;margin-top:8px}.chatTop{display:flex;align-items:center;gap:16px;padding:22px 28px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.back{font-size:34px}.chatTitle{font-weight:800;font-size:22px}.messages{padding:28px 28px 120px}.row{display:flex;margin-bottom:14px}.row.mine{justify-content:flex-end}.bubble{max-width:78%;padding:17px 20px;border-radius:25px;background:#242424;font-size:20px;line-height:1.22}.mine .bubble{background:#efefef;color:#111}.seq{display:block;font-size:14px;color:#888;margin-top:5px}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;background:#070707;border-top:1px solid #272727}.composer .input{margin:0}.send{width:68px;flex:none;font-size:30px}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:14px;z-index:20;background:#303030}.status.bad{background:#8b5a00}.status.good{background:#174d29}.empty{color:#777;padding:28px;font-size:20px}.small{font-size:14px;color:#777;margin-top:12px}
</style>
</head><body><div id="root" class="app"></div><script>
const URL='https://ctcoqgsztdtsazdiwcmd.supabase.co',KEY='sb_publishable_kMGqZAM2vadfXbBr8r5uzw_l9EiBtIw';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),root=document.getElementById('root');
let session=null,profile=null,current=null,channel=null,pollTimer=null,lastSig='';
const OUT='vision-talk-outbox-v3',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uuid=()=>crypto.randomUUID();
function status(t,k=''){let b=document.getElementById('netStatus');if(!b){b=document.createElement('div');b.id='netStatus';document.body.appendChild(b)}b.className='status '+k;b.textContent=t;clearTimeout(status.t);if(k==='good')status.t=setTimeout(()=>b.remove(),1400)}
function qget(){try{return JSON.parse(localStorage.getItem(OUT)||'[]')}catch{return[]}}function qput(q){localStorage.setItem(OUT,JSON.stringify(q))}
async function flush(){if(!navigator.onLine||!session)return;let q=qget(),r=[];for(const m of q){let {error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error)r.push(m)}qput(r);if(current)await syncMessages(true)}
window.addEventListener('offline',()=>status('Нет сети · сообщения в очереди','bad'));window.addEventListener('online',async()=>{status('Сеть восстановлена','good');await flush()});
async function boot(){let {data}=await sb.auth.getSession();session=data.session;if(!session)return login();let {data:p,error}=await sb.from('profiles').select('id,username,display_name,is_approved').eq('id',session.user.id).single();if(error)return fatal(error.message);profile=p;if(!p.is_approved)return fatal('Ожидается доступ для @'+p.username);dialogs();flush()}
function login(msg=''){stopSync();root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Вход</div><div class="muted">Закрытый мессенджер · стабильный MVP</div><input id=e class=input type=email placeholder=email><input id=p class=input type=password placeholder=пароль><button id=l class="btn full">Войти</button><div id=er class=error>${esc(msg)}</div><div class=small>stable-origin · autosync-v3</div></div>`;l.onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(error)er.textContent=error.message;else boot()}}
function fatal(m){root.innerHTML=`<div class=card><div class=brand>VISION TALK</div><div class=title>Ошибка</div><div class=muted>${esc(m)}</div><button id=o class="btn full">Выйти</button></div>`;o.onclick=async()=>{await sb.auth.signOut();login()}}
async function dialogs(){stopSync();if(channel){await sb.removeChannel(channel);channel=null}current=null;root.innerHTML=`<div class=top><div><div class=brand>VISION TALK</div><h1>Диалоги</h1></div><div class=topRight><span>@${esc(profile.username)}</span><span id=lo>Выйти</span></div></div><div class=compose><input id=u class=input placeholder=username><button id=st class="btn plus">+</button></div><div id=se class=error style="padding:0 28px"></div><div id=ds></div>`;lo.onclick=async()=>{await sb.auth.signOut();session=null;login()};st.onclick=async()=>{let x=u.value.trim().replace(/^@/,'');if(!x)return;let {data,error}=await sb.rpc('start_direct_conversation',{target_username:x});if(error)se.textContent=error.message;else openChat(data,x)};let {data,error}=await sb.rpc('my_conversations');if(error)return ds.innerHTML=`<div class=error style="padding:28px">${esc(error.message)}</div>`;ds.innerHTML=data?.length?data.map(d=>`<div class=dialog data-id="${d.id}" data-title="${esc(d.title||'Диалог')}"><div class=name>${esc(d.title||'Диалог')}</div><div class=preview>${esc(d.last_message||'')}</div></div>`).join(''):'<div class=empty>Диалогов пока нет.</div>';document.querySelectorAll('.dialog').forEach(x=>x.onclick=()=>openChat(x.dataset.id,x.dataset.title))}
async function openChat(id,title){stopSync();current={id,title};lastSig='';root.innerHTML=`<div class=chatTop><div id=b class=back>‹</div><div><div class=chatTitle>${esc(title||'Диалог')}</div><div class=small>Vision talk · autosync-v3</div></div></div><div id=ms class=messages></div><div class=composer><input id=m class=input placeholder=Сообщение><button id=s class="btn send">↑</button></div>`;b.onclick=dialogs;s.onclick=send;m.addEventListener('keydown',e=>{if(e.key==='Enter')send()});await syncMessages(true);subscribe(id);startSync()}
async function syncMessages(force=false){if(!current||document.hidden||!navigator.onLine)return;let convId=current.id,{data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body,created_at').eq('conversation_id',convId).order('server_seq',{ascending:true});if(error||!current||current.id!==convId)return;let sig=(data||[]).map(x=>`${x.id}:${x.server_seq}`).join('|');if(!force&&sig===lastSig)return;lastSig=sig;render(data||[])}
function render(list){let el=document.getElementById('ms');if(!el)return;let seen=new Set(),u=list.filter(x=>{let k=x.client_message_id||x.id;if(seen.has(k))return false;seen.add(k);return true});el.innerHTML=u.map(x=>`<div class="row ${x.sender_id===session.user.id?'mine':''}"><div class=bubble>${esc(x.body)}<span class=seq>#${x.server_seq}</span></div></div>`).join('');window.scrollTo(0,document.body.scrollHeight)}
function startSync(){stopSync();pollTimer=setInterval(()=>syncMessages(false),1200)}function stopSync(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&current){syncMessages(true);startSync()}else if(document.hidden)stopSync()});
function subscribe(cid){if(channel)sb.removeChannel(channel);channel=sb.channel('conversation:'+cid+':'+uuid()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},()=>{if(current?.id===cid)syncMessages(true)}).subscribe(x=>{if(x==='SUBSCRIBED')status('Realtime подключён','good');else if(x==='CHANNEL_ERROR'||x==='TIMED_OUT')status('Realtime '+x+' · autosync активен','bad')})}
async function send(){let el=document.getElementById('m'),body=el?.value.trim();if(!body||!current)return;el.value='';let x={conversation_id:current.id,client_message_id:uuid(),body};if(!navigator.onLine){let q=qget();q.push(x);qput(q);status('Нет сети · сообщение сохранено','bad');return}let {error}=await sb.rpc('send_message',{p_conversation_id:x.conversation_id,p_client_message_id:x.client_message_id,p_type:'text',p_body:x.body,p_attachment_path:null});if(error){let q=qget();q.push(x);qput(q);status('Отправка отложена','bad')}else await syncMessages(true)}
sb.auth.onAuthStateChange((e,s)=>{session=s;if(e==='SIGNED_OUT')login()});boot();
</script></body></html>
