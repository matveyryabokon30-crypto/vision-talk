async function initialMessages(){let {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,type,body,attachment_path,created_at').eq('conversation_id',currentConversation.id).order('server_seq',{ascending:true}),box=document.getElementById('messages');if(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}box.textContent='';appendMessages(data||[],true);syncPending();bottom()}async function newMessages(){let {data}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,type,body,attachment_path,created_at').eq('conversation_id',currentConversation.id).gt('server_seq',lastSeq).order('server_seq',{ascending:true});if(data?.length)appendMessages(data,false)}async function markRead(){if(!currentConversation||!lastSeq||!navigator.onLine)return;await sb.rpc('mark_conversation_read',{p_conversation_id:currentConversation.id,p_last_read_seq:lastSeq})}async function peer(){if(!currentConversation)return;let {data}=await sb.from('conversation_members').select('last_read_seq').eq('conversation_id',currentConversation.id).neq('user_id',session.user.id).limit(1).maybeSingle(),v=Number(data?.last_read_seq||0);if(v!==peerRead){peerRead=v;document.querySelectorAll('.row.mine:not(.pending)').forEach(r=>{let s=r.querySelector('.seq'),n=Number(r.dataset.seq||0);if(s&&n)s.textContent=meta(n,true)})}}
function sendNow(){let input=document.getElementById('msg'),body=input.value.trim();if(!body||!currentConversation)return;let m={conversation_id:currentConversation.id,client_message_id:uuid(),body};input.value='';input.dispatchEvent(new Event('input'));enqueue(m);appendPending(m,true);flush()}function sendText(t){let i=document.getElementById('msg');if(!i)return;i.value=t;sendNow()}
function ensureInputs(){if(document.getElementById('galInput'))return;let h='<input id="galInput" type="file" accept="image/*,video/*" multiple hidden><input id="camInput" type="file" accept="image/*,video/*" capture="environment" hidden><input id="docInput" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.rtf,.zip,.rar,.7z" multiple hidden><input id="fileInput" type="file" multiple hidden><input id="scanInput" type="file" accept="image/*" capture="environment" hidden><input id="contactInput" type="file" accept=".vcf,text/vcard,text/x-vcard" hidden>';document.querySelector('.chatShell')?.insertAdjacentHTML('beforeend',h);galInput.onchange=e=>files(e.target.files,'gallery',e.target);camInput.onchange=e=>files(e.target.files,'camera',e.target);docInput.onchange=e=>files(e.target.files,'document',e.target);fileInput.onchange=e=>files(e.target.files,'file',e.target);scanInput.onchange=e=>files(e.target.files,'scan',e.target);contactInput.onchange=contactFile}
function pick(t){ensureInputs();({gallery:galInput,camera:camInput,document:docInput,file:fileInput,scan:scanInput,contact:contactInput}[t])?.click()}
function files(list,source,input){for(let f of Array.from(list||[])){let key=f.name+':'+f.size+':'+f.lastModified;if(selected.some(x=>x.key===key))continue;let kind=f.type.startsWith('video/')?'video':f.type.startsWith('image/')?'image':'doc',url=(kind==='image'||kind==='video')?URL.createObjectURL(f):'';if(url)selectedUrls.push(url);selected.push({key,file:f,kind,source,url})}if(input)input.value='';renderSheet();if(selected.length)status('Выбрано: '+selected.length,'good')}
function clearSelected(){selectedUrls.forEach(URL.revokeObjectURL);selectedUrls=[];selected=[]}function size(n){return n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ'}
function tab(id,label,svg){return`<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${svg}<span>${label}</span></button>`}function title(){return({gallery:'Недавние',location:'Геопозиция',contact:'Контакты',document:'Документы',scan:'Сканер'}[activeTab]||'Вложения')}
function openSheet(){if(document.getElementById('sheetBackdrop'))return closeSheet(false);ensureInputs();activeTab='gallery';clearSelected();let shell=document.querySelector('.chatShell'),d=document.createElement('div');d.id='sheetBackdrop';d.className='sheetBackdrop';d.innerHTML=`<section class="sheet"><header class="sheetHead"><button id="sheetClose" class="iconBtn sheetClose">×</button><div id="sheetTitle" class="sheetTitle"></div><span></span></header><main id="sheetBody" class="sheetBody"></main><div id="sendDock" class="sendDock"><button id="sendFiles" class="sendBtn">Отправить</button></div><nav class="tabbar">${tab('gallery','Галерея',icons.file.replace('path d="M14 2H6','rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/><path d="M14 2H6'))}${tab('location','Геопозиция',icons.pin)}${tab('contact','Контакт',icons.contact)}${tab('document','Документы',icons.file)}${tab('scan','Сканер',icons.scan)}</nav></section>`;shell.appendChild(d);d.onclick=e=>{if(e.target===d)closeSheet()};d.querySelector('.sheet').onclick=e=>e.stopPropagation();sheetClose.onclick=()=>closeSheet();sendFiles.onclick=sendSelected;d.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{activeTab=x.dataset.tab;renderSheet()});renderSheet()}
function closeSheet(discard=true){document.getElementById('sheetBackdrop')?.remove();if(discard)clearSelected()}
function galleryPanel(){let media=selected.filter(x=>x.kind==='image'||x.kind==='video'),thumbs=media.map(x=>`<button class="tile thumb" data-r="${esc(x.key)}">${x.kind==='video'?`<video src="${x.url}" muted playsinline></video><span class="mediaType">Видео</span>`:`<img src="${x.url}">`}<span class="check">✓</span></button>`).join(''),empty=Math.max(0,4-media.length);return`<div class="galleryGrid"><button class="tile cameraTile" id="cameraTile">${icons.cam}<span>Камера</span></button>${thumbs}${Array.from({length:empty},()=>'<button class="tile emptyTile" data-open-gallery></button>').join('')}<button class="tile galleryOpen" id="openGallery">${icons.file}<span>Открыть галерею</span></button></div>`}
function fileList(){let docs=selected.filter(x=>x.kind==='doc'||x.source==='document'||x.source==='file'||x.source==='scan');return docs.length?`<div class="fileList">${docs.map(x=>`<div class="fileRow"><div class="fileIcon">${icons.file}</div><div><div class="fileName">${esc(x.file.name)}</div><div class="fileMeta">${size(x.file.size)}</div></div></div>`).join('')}</div>`:''}
function panel(){if(activeTab==='gallery')return galleryPanel();if(activeTab==='location')return`<div class="panel"><button id="locNow" class="panelAction">${icons.pin}<span><strong>Отправить геопозицию</strong><small>Текущая точка по GPS</small></span></button><button class="panelAction" onclick="status('Live‑геопозиция будет отдельным блоком')">${icons.pin}<span><strong>Транслировать геопозицию</strong><small>Реалтайм‑гео позже</small></span></button></div>`;if(activeTab==='contact')return`<div class="panel"><button id="contactPick" class="panelAction">${icons.contact}<span><strong>Выбрать контакт</strong><small>Системный контакт или vCard</small></span></button></div>`;if(activeTab==='document')return`<div class="panel"><button id="docPick" class="panelAction">${icons.file}<span><strong>Выбрать документ</strong><small>PDF, Word, Excel, архивы</small></span></button><button id="filePick" class="panelAction">${icons.file}<span><strong>Выбрать из файлов</strong><small>Любой файл из «Файлы»</small></span></button><button id="docScan" class="panelAction">${icons.scan}<span><strong>Сканировать документ</strong><small>Открыть камеру</small></span></button>${fileList()}</div>`;return`<div class="panel"><button id="scanPick" class="panelAction">${icons.scan}<span><strong>Сканировать документ</strong><small>Открыть камеру для скана</small></span></button>${fileList()}</div>`}
function renderSheet(){let b=document.getElementById('sheetBody');if(!b)return;sheetTitle.innerHTML=`${title()}<span class="sheetSub">${selected.length?'Выбрано: '+selected.length:VERSION}</span>`;b.innerHTML=panel();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab));sendDock.classList.toggle('show',selected.length>0);sendFiles.textContent=selected.length?'Отправить '+selected.length:'Отправить';document.querySelectorAll('[data-open-gallery]').forEach(x=>x.onclick=()=>pick('gallery'));document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{let n=selected.findIndex(v=>v.key===x.dataset.r);if(n>=0){let u=selected[n].url;if(u)URL.revokeObjectURL(u);selected.splice(n,1);renderSheet()}});cameraTile?.addEventListener('click',()=>pick('camera'));openGallery?.addEventListener('click',()=>pick('gallery'));locNow?.addEventListener('click',locationSend);contactPick?.addEventListener('click',contactPickFn);docPick?.addEventListener('click',()=>pick('document'));filePick?.addEventListener('click',()=>pick('file'));docScan?.addEventListener('click',()=>pick('scan'));scanPick?.addEventListener('click',()=>pick('scan'))}
function sendSelected(){if(!selected.length)return;let text='📎 Вложения выбраны\n'+selected.map(x=>'• '+x.file.name+' · '+size(x.file.size)).join('\n');closeSheet();sendText(text)}
function locationSend(){closeSheet(false);if(!navigator.geolocation){status('Геолокация недоступна','bad');return}status('Определяю геопозицию…');navigator.geolocation.getCurrentPosition(p=>{closeSheet();sendText(`📍 Геопозиция\nhttps://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`)},e=>status(e.message||'Не удалось получить геопозицию','bad'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
async function contactPickFn(){try{if(navigator.contacts?.select){let r=await navigator.contacts.select(['name','tel','email'],{multiple:false}),c=r?.[0];if(c){closeSheet();sendText(['👤 '+(c.name?.[0]||'Контакт'),c.tel?.[0]||'',c.email?.[0]||''].filter(Boolean).join('\n'));return}}}catch(e){}pick('contact')}
async function contactFile(e){let f=e.target.files?.[0];e.target.value='';if(!f)return;let t=await f.text().catch(()=>'');let name=(t.match(/^FN:(.+)$/mi)?.[1]||f.name).trim(),tel=(t.match(/^TEL[^:]*:(.+)$/mi)?.[1]||'').trim(),mail=(t.match(/^EMAIL[^:]*:(.+)$/mi)?.[1]||'').trim();closeSheet();sendText(['👤 '+name,tel,mail].filter(Boolean).join('\n'))}
window.addEventListener('online',()=>{status('Сеть восстановлена','good');flush();currentConversation?newMessages():loadDialogs()});window.addEventListener('offline',()=>status('Нет сети · очередь сохранится','bad'));boot();
</script></body></html>
