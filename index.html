<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Vision Talk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:#070707;color:#fff;--chat-height:100dvh}*{box-sizing:border-box}html,body{overscroll-behavior:none}body{margin:0;background:#070707;min-height:100vh}.app{max-width:760px;margin:0 auto;min-height:100vh}.card{margin:22vh 22px 0;padding:34px 28px;border:1px solid #303030;border-radius:28px;background:#151515}.brand{color:#a8ffbd;font-size:18px;font-weight:800;letter-spacing:3px}.title{font-size:42px;font-weight:800;margin:28px 0 10px}.muted{color:#969696;font-size:20px;line-height:1.35}.input{width:100%;background:#0b0b0b;border:1px solid #353535;border-radius:22px;color:#fff;font-size:20px;padding:22px 24px;margin-top:14px;outline:none}.btn{border:0;border-radius:22px;background:#f5f5f5;color:#080808;font-size:20px;font-weight:800;padding:20px 24px;min-height:62px}.btn.full{width:100%;margin-top:14px}.error{color:#ffaaaa;margin-top:18px;font-size:18px}.shell{min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 22px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.top h1{font-size:28px;margin:2px 0}.topRight{display:flex;gap:22px;align-items:center;color:#bbb;font-size:19px}.compose{display:flex;gap:12px;padding:28px}.compose .input{margin:0;flex:1}.plus{width:72px;flex:none;font-size:34px}.dialog{margin:0 28px 14px;border:1px solid #2f2f2f;border-radius:24px;padding:22px 24px;background:#111;cursor:pointer}.dialogLine{display:flex;align-items:center;justify-content:space-between;gap:14px}.dialog .name{font-size:20px;font-weight:800}.dialog .preview{color:#888;font-size:18px;margin-top:8px}.badge{min-width:28px;height:28px;padding:0 9px;border-radius:999px;background:#f5f5f5;color:#111;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}.chatTop{display:flex;align-items:center;gap:16px;padding:22px 28px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.back{font-size:34px;cursor:pointer}.chatTitle{font-weight:800;font-size:22px}.messages{padding:28px 28px 120px}.row{display:flex;margin-bottom:14px}.row.mine{justify-content:flex-end}.bubble{max-width:78%;padding:17px 20px;border-radius:25px;background:#242424;font-size:20px;line-height:1.22}.mine .bubble{background:#efefef;color:#111}.row.pending .bubble{opacity:.62}.seq{display:block;font-size:14px;color:#888;margin-top:5px}.pending .seq{color:#777}.pendingSpinner{display:inline-block;width:12px;height:12px;border:2px solid #aaa;border-top-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;background:#070707;border-top:1px solid #272727}.composer .input{margin:0}.send{width:68px;flex:none;font-size:30px}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:14px;z-index:20;background:#303030}.status.bad{background:#8b5a00}.status.good{background:#174d29}.empty{color:#777;padding:28px;font-size:20px}.small{font-size:14px;color:#777;margin-top:12px}.chatShell{height:var(--chat-height);min-height:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}.chatShell .chatTop{position:relative;top:auto;flex:none}.chatShell .messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:28px}.chatShell .composer{position:relative;bottom:auto;left:auto;transform:none;max-width:none;width:100%;flex:none;touch-action:manipulation}.chatShell .composer .input{touch-action:manipulation}.chatShell.keyboardOpen .composer{padding-bottom:14px}
</style>
</head>
<body><div id="root" class="app"></div>
<script>
const SUPABASE_URL='https://ctcoqgsztdtsazdiwcmd.supabase.co';
const SUPABASE_KEY='sb_publishable_kMGqZAM2vadfXbBr8r5uzw_l9EiBtIw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById('root');
let session=null,profile=null,currentConversation=null,channel=null,realtimeStatus='CLOSED',autosyncTimer=null,lastRenderedSeq=0,renderedIds=new Set(),flushing=false,peerReadSeq=0,dialogsSignature='',keyboardStickBottom=true;
const QUEUE_KEY='vision-talk-outbox-v3';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();
function showStatus(text,kind=''){let b=document.getElementById('netStatus');if(!b){b=document.createElement('div');b.id='netStatus';document.body.appendChild(b)}b.className='status '+kind;b.textContent=text;clearTimeout(showStatus.t);if(kind==='good')showStatus.t=setTimeout(()=>b.remove(),1800)}
function networkStatus(){if(!navigator.onLine)showStatus('Нет сети · новые сообщения останутся в очереди','bad')}
window.addEventListener('offline',networkStatus);
window.addEventListener('online',async()=>{showStatus('Сеть восстановлена · отправляю очередь','good');await flushQueue();if(currentConversation){await syncNewMessages(currentConversation,true);await markCurrentRead();await syncPeerRead()}else{await loadDialogs()}});
function queueGet(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch{return[]}}
function queuePut(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));updatePendingRows()}
function enqueue(m){const q=queueGet();if(!q.some(x=>x.client_message_id===m.client_message_id))q.push(m);queuePut(q)}
function dequeue(id){queuePut(queueGet().filter(x=>x.client_message_id!==id))}
function stopAutosync(){if(autosyncTimer){clearInterval(autosyncTimer);autosyncTimer=null}}
async function checkForNewMessages(){if(document.hidden||!navigator.onLine||!currentConversation)return;await syncNewMessages(currentConversation,false);await markCurrentRead();await syncPeerRead()}
function startAutosync(){stopAutosync();autosyncTimer=setInterval(checkForNewMessages,1500)}
function startDialogsAutosync(){stopAutosync();autosyncTimer=setInterval(()=>{if(!document.hidden&&navigator.onLine&&!currentConversation)loadDialogs()},1500)}
function pendingForConversation(cid){return queueGet().filter(m=>m.conversation_id===cid)}
function chatNearBottom(){const el=document.getElementById('messages');return !el||(el.scrollHeight-el.scrollTop-el.clientHeight)<=140}
function scrollChatBottom(){const el=document.getElementById('messages');if(el)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function syncChatViewport(){const shell=document.querySelector('.chatShell');if(!shell)return;const vv=window.visualViewport;const h=vv?Math.round(vv.height):window.innerHeight;document.documentElement.style.setProperty('--chat-height',h+'px');const keyboardOpen=vv?vv.height<window.innerHeight-80:false;shell.classList.toggle('keyboardOpen',keyboardOpen);if(keyboardStickBottom)scrollChatBottom()}
if(window.visualViewport){window.visualViewport.addEventListener('resize',syncChatViewport);window.visualViewport.addEventListener('scroll',syncChatViewport)}
window.addEventListener('resize',syncChatViewport);
function appendPending(m,forceScroll=true){const el=document.getElementById('messages');if(!el||!currentConversation||m.conversation_id!==currentConversation.id)return;const domId='pending-'+m.client_message_id;if(document.getElementById(domId)||renderedIds.has(m.client_message_id))return;const wasNearBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<=140;const row=document.createElement('div');row.id=domId;row.className='row mine pending';const bubble=document.createElement('div');bubble.className='bubble';bubble.appendChild(document.createTextNode(m.body??''));const seq=document.createElement('span');seq.className='seq';const spinner=document.createElement('span');spinner.className='pendingSpinner';spinner.setAttribute('aria-label','отправка');seq.appendChild(spinner);bubble.appendChild(seq);row.appendChild(bubble);el.appendChild(row);if(forceScroll||wasNearBottom)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function updatePendingRows(){if(!currentConversation)return;const ids=new Set(pendingForConversation(currentConversation.id).map(m=>m.client_message_id));document.querySelectorAll('.row.pending[id^="pending-"]').forEach(row=>{const id=row.id.slice(8);if(!ids.has(id))row.remove()});for(const m of pendingForConversation(currentConversation.id))appendPending(m,false)}
function metaText(seq,mine){return '#'+seq+(mine?(Number(seq)<=peerReadSeq?' · ✓✓':' · ✓'):'')}
function refreshReadMarks(){document.querySelectorAll('#messages .row.mine:not(.pending)').forEach(row=>{const seqNum=Number(row.dataset.seq||0);const seq=row.querySelector('.seq');if(seq&&seqNum)seq.textContent=metaText(seqNum,true)})}
async function markCurrentRead(){if(document.hidden||!navigator.onLine||!currentConversation||!lastRenderedSeq)return;await sb.rpc('mark_conversation_read',{p_conversation_id:currentConversation.id,p_last_read_seq:lastRenderedSeq})}
async function syncPeerRead(){if(!currentConversation||!session)return;const {data,error}=await sb.from('conversation_members').select('last_read_seq').eq('conversation_id',currentConversation.id).neq('user_id',session.user.id).limit(1).maybeSingle();if(error||!data)return;const next=Number(data.last_read_seq||0);if(next!==peerReadSeq){peerReadSeq=next;refreshReadMarks()}}
async function flushQueue(){if(flushing||!navigator.onLine||!session)return;flushing=true;try{let q=queueGet();if(!q.length)return;let sent=0;for(const m of [...q]){const {data,error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error){showStatus('Очередь остановлена · повторю при следующем соединении','bad');break}if(data&&currentConversation?.id===m.conversation_id)appendMessages([data],true);dequeue(m.client_message_id);sent++}if(sent){showStatus(sent===1?'Сообщение доставлено':`Доставлено из очереди: ${sent}`,'good');if(currentConversation){await syncNewMessages(currentConversation,true);await markCurrentRead();await syncPeerRead()}else{await loadDialogs()}}}finally{flushing=false}}
async function boot(){const {data}=await sb.auth.getSession();session=data.session;if(!session)return renderLogin();const {data:p,error}=await sb.from('profiles').select('id,username,display_name,is_approved').eq('id',session.user.id).single();if(error)return renderFatal(error.message);profile=p;if(!profile.is_approved)return renderFatal('Ожидается доступ: администратор должен включить is_approved для @'+profile.username);await renderDialogs();flushQueue()}
function renderLogin(msg=''){stopAutosync();document.documentElement.style.setProperty('--chat-height','100dvh');root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Вход</div><div class="muted">Закрытый мессенджер · стабильный MVP</div><input id="email" class="input" type="email" placeholder="email"><input id="password" class="input" type="password" placeholder="пароль"><button id="login" class="btn full">Войти</button><div id="err" class="error">${esc(msg)}</div><div class="small">stable-origin · keyboard-v12</div></div>`;document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('err').textContent=error.message;boot()}}
function renderFatal(msg){stopAutosync();root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Ошибка</div><div class="muted">${esc(msg)}</div><button class="btn full" id="out">Выйти</button></div>`;document.getElementById('out').onclick=async()=>{await sb.auth.signOut();renderLogin()}}
async function renderDialogs(){stopAutosync();document.documentElement.style.setProperty('--chat-height','100dvh');currentConversation=null;lastRenderedSeq=0;peerReadSeq=0;dialogsSignature='';renderedIds.clear();if(channel){await sb.removeChannel(channel);channel=null}root.innerHTML=`<div class="shell"><div class="top"><div><div class="brand">VISION TALK</div><h1>Диалоги</h1></div><div class="topRight"><span>@${esc(profile.username)}</span><span id="logout">Выйти</span></div></div><div class="compose"><input id="username" class="input" placeholder="username"><button id="start" class="btn plus">+</button></div><div id="startErr" class="error" style="padding:0 28px"></div><div id="dialogs"></div><div class="small" style="padding:0 28px 24px">Vision talk · keyboard-v12</div></div>`;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();session=null;renderLogin()};document.getElementById('start').onclick=async()=>{let u=document.getElementById('username').value.trim().replace(/^@/,'');if(!u)return;const {data,error}=await sb.rpc('start_direct_conversation',{target_username:u});if(error)return document.getElementById('startErr').textContent=error.message;openConversation(data,u)};await loadDialogs();startDialogsAutosync()}
async function loadDialogs(){const el=document.getElementById('dialogs');if(!el)return;const {data,error}=await sb.rpc('my_conversations_v2');if(error){el.innerHTML=`<div class="error" style="padding:28px">${esc(error.message)}</div>`;return}if(!data?.length){dialogsSignature='empty';el.innerHTML='<div class="empty">Диалогов пока нет.</div>';return}const sig=JSON.stringify(data.map(d=>[d.id,d.last_message,d.last_seq,d.last_read_seq,d.unread_count]));if(sig===dialogsSignature)return;dialogsSignature=sig;el.innerHTML=data.map(d=>{const unread=Number(d.unread_count||0);return `<div class="dialog" data-id="${d.id}" data-title="${esc(d.title||'Диалог')}"><div class="dialogLine"><div class="name">${esc(d.title||'Диалог')}</div>${unread>0?`<div class="badge">${unread>99?'99+':unread}</div>`:''}</div><div class="preview">${esc(d.last_message||'')}</div></div>`}).join('');el.querySelectorAll('.dialog').forEach(x=>x.onclick=()=>openConversation(x.dataset.id,x.dataset.title))}
async function openConversation(id,title){stopAutosync();lastRenderedSeq=0;peerReadSeq=0;renderedIds.clear();currentConversation={id,title};root.innerHTML=`<div class="shell chatShell"><div class="chatTop"><div id="back" class="back">‹</div><div><div class="chatTitle">${esc(title||'Диалог')}</div><div class="small">Vision talk · keyboard-v12</div></div></div><div id="messages" class="messages"></div><div class="composer"><input id="message" class="input" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Сообщение"><button id="send" class="btn send">↑</button></div></div>`;document.getElementById('back').onclick=()=>{stopAutosync();currentConversation=null;renderDialogs()};const input=document.getElementById('message'),send=document.getElementById('send');send.addEventListener('pointerdown',e=>e.preventDefault());send.onclick=sendCurrent;input.addEventListener('focus',()=>{keyboardStickBottom=chatNearBottom();requestAnimationFrame(syncChatViewport)});input.addEventListener('blur',()=>{setTimeout(()=>{keyboardStickBottom=chatNearBottom();syncChatViewport()},60)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCurrent()}});await loadInitialMessages(currentConversation);for(const m of pendingForConversation(id))appendPending(m,false);await markCurrentRead();await syncPeerRead();subscribeMessages(id);startAutosync();syncChatViewport();if(navigator.onLine)flushQueue()}
async function loadInitialMessages(conv){if(!conv||currentConversation?.id!==conv.id)return;const {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body,created_at').eq('conversation_id',conv.id).order('server_seq',{ascending:true});const el=document.getElementById('messages');if(!el)return;if(error){el.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}renderedIds.clear();el.textContent='';appendMessages(data||[],true)}
async function syncNewMessages(conv,forceScroll=false){if(!conv||currentConversation?.id!==conv.id)return;const {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body,created_at').eq('conversation_id',conv.id).gt('server_seq',lastRenderedSeq).order('server_seq',{ascending:true});if(error||currentConversation?.id!==conv.id)return;if(data?.length)appendMessages(data,forceScroll);updatePendingRows()}
function insertConfirmedRow(el,row,seq){row.dataset.seq=String(seq);let before=null;for(const child of el.children){if(child===row)continue;if(child.classList.contains('pending')){before=child;break}const childSeq=Number(child.dataset.seq||0);if(childSeq&&childSeq>Number(seq)){before=child;break}}if(before)el.insertBefore(row,before);else el.appendChild(row)}
function appendMessages(list,forceScroll=false){const el=document.getElementById('messages');if(!el)return;const wasNearBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<=140;let changed=0;for(const m of list){const key=m.client_message_id||m.id;if(renderedIds.has(key))continue;const pending=document.getElementById('pending-'+key);const mine=m.sender_id===session.user.id;renderedIds.add(key);lastRenderedSeq=Math.max(lastRenderedSeq,Number(m.server_seq||0));if(pending){pending.removeAttribute('id');pending.classList.remove('pending');pending.dataset.mine='1';const bubble=pending.querySelector('.bubble');bubble.textContent='';bubble.appendChild(document.createTextNode(m.body??''));const seq=document.createElement('span');seq.className='seq';seq.textContent=metaText(m.server_seq,true);bubble.appendChild(seq);insertConfirmedRow(el,pending,m.server_seq);changed++;continue}const row=document.createElement('div');row.className='row '+(mine?'mine':'');row.dataset.mine=mine?'1':'0';const bubble=document.createElement('div');bubble.className='bubble';bubble.appendChild(document.createTextNode(m.body??''));const seq=document.createElement('span');seq.className='seq';seq.textContent=metaText(m.server_seq,mine);bubble.appendChild(seq);row.appendChild(bubble);insertConfirmedRow(el,row,m.server_seq);changed++}if(!changed)return;if(forceScroll||wasNearBottom)requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function subscribeMessages(cid){if(channel)sb.removeChannel(channel);channel=sb.channel('conversation:'+cid+'-'+uuid()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},async payload=>{if(currentConversation?.id===cid&&payload?.new){appendMessages([payload.new],false);await markCurrentRead()}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversation_members',filter:'conversation_id=eq.'+cid},payload=>{if(currentConversation?.id===cid&&payload?.new&&payload.new.user_id!==session.user.id){peerReadSeq=Number(payload.new.last_read_seq||0);refreshReadMarks()}}).subscribe(status=>{realtimeStatus=status;if(status==='SUBSCRIBED')showStatus('Realtime подключён','good');else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')showStatus('Realtime: '+status,'bad')})}
async function sendCurrent(){const input=document.getElementById('message');if(!input||!currentConversation)return;const body=input.value.trim();if(!body)return;input.value='';keyboardStickBottom=true;const m={conversation_id:currentConversation.id,client_message_id:uuid(),body,created_at:Date.now()};enqueue(m);appendPending(m,true);if(document.activeElement!==input){try{input.focus({preventScroll:true})}catch{input.focus()}}if(!navigator.onLine){showStatus('Нет сети · сообщение сохранено','bad');return}const {data,error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error){showStatus('Отправка отложена · сохранено в очереди','bad');return}if(data)appendMessages([data],true);dequeue(m.client_message_id);await syncNewMessages(currentConversation,true);await syncPeerRead()}
sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='SIGNED_OUT')renderLogin()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(currentConversation){syncChatViewport();syncNewMessages(currentConversation,false);markCurrentRead();syncPeerRead();if(navigator.onLine)flushQueue()}else{loadDialogs();if(navigator.onLine)flushQueue()}});
boot();
</script></body></html>
