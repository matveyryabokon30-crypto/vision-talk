<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Vision Talk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;background:#070707;color:#fff}*{box-sizing:border-box}body{margin:0;background:#070707;min-height:100vh}.app{max-width:760px;margin:0 auto;min-height:100vh}.card{margin:22vh 22px 0;padding:34px 28px;border:1px solid #303030;border-radius:28px;background:#151515}.brand{color:#a8ffbd;font-size:18px;font-weight:800;letter-spacing:3px}.title{font-size:42px;font-weight:800;margin:28px 0 10px}.muted{color:#969696;font-size:20px;line-height:1.35}.input{width:100%;background:#0b0b0b;border:1px solid #353535;border-radius:22px;color:#fff;font-size:20px;padding:22px 24px;margin-top:14px;outline:none}.btn{border:0;border-radius:22px;background:#f5f5f5;color:#080808;font-size:20px;font-weight:800;padding:20px 24px;min-height:62px}.btn.full{width:100%;margin-top:14px}.error{color:#ffaaaa;margin-top:18px;font-size:18px}.shell{min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 22px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.top h1{font-size:28px;margin:2px 0}.topRight{display:flex;gap:22px;align-items:center;color:#bbb;font-size:19px}.compose{display:flex;gap:12px;padding:28px}.compose .input{margin:0;flex:1}.plus{width:72px;flex:none;font-size:34px}.dialog{margin:0 28px 14px;border:1px solid #2f2f2f;border-radius:24px;padding:22px 24px;background:#111;cursor:pointer}.dialog .name{font-size:20px;font-weight:800}.dialog .preview{color:#888;font-size:18px;margin-top:8px}.chatTop{display:flex;align-items:center;gap:16px;padding:22px 28px;border-bottom:1px solid #272727;position:sticky;top:0;background:#070707;z-index:5}.back{font-size:34px;cursor:pointer}.chatTitle{font-weight:800;font-size:22px}.messages{padding:28px 28px 120px}.row{display:flex;margin-bottom:14px}.row.mine{justify-content:flex-end}.bubble{max-width:78%;padding:17px 20px;border-radius:25px;background:#242424;font-size:20px;line-height:1.22}.mine .bubble{background:#efefef;color:#111}.seq{display:block;font-size:14px;color:#888;margin-top:5px}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:760px;width:100%;padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;background:#070707;border-top:1px solid #272727}.composer .input{margin:0}.send{width:68px;flex:none;font-size:30px}.status{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:14px;z-index:20;background:#303030}.status.bad{background:#8b5a00}.status.good{background:#174d29}.empty{color:#777;padding:28px;font-size:20px}.small{font-size:14px;color:#777;margin-top:12px}
</style>
</head>
<body><div id="root" class="app"></div>
<script>
const SUPABASE_URL='https://ctcoqgsztdtsazdiwcmd.supabase.co';
const SUPABASE_KEY='sb_publishable_kMGqZAM2vadfXbBr8r5uzw_l9EiBtIw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const root=document.getElementById('root');
let session=null,profile=null,currentConversation=null,channel=null,realtimeStatus='CLOSED';
const QUEUE_KEY='vision-talk-outbox-v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();
function showStatus(text,kind=''){let b=document.getElementById('netStatus');if(!b){b=document.createElement('div');b.id='netStatus';document.body.appendChild(b)}b.className='status '+kind;b.textContent=text;clearTimeout(showStatus.t);if(kind==='good')showStatus.t=setTimeout(()=>b.remove(),1600)}
function networkStatus(){if(!navigator.onLine)showStatus('Нет сети · сообщения в очереди','bad')}
window.addEventListener('offline',networkStatus);
window.addEventListener('online',async()=>{showStatus('Сеть восстановлена','good');await flushQueue();if(currentConversation)await loadMessages(currentConversation)});
function queueGet(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch{return[]}}
function queuePut(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q))}
async function flushQueue(){if(!navigator.onLine||!session)return;const q=queueGet();if(!q.length)return;const remain=[];for(const m of q){const {error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error)remain.push(m)}queuePut(remain);if(remain.length)showStatus('Часть сообщений остаётся в очереди','bad');if(currentConversation)await loadMessages(currentConversation)}
async function boot(){const {data}=await sb.auth.getSession();session=data.session;if(!session)return renderLogin();const {data:p,error}=await sb.from('profiles').select('id,username,display_name,is_approved').eq('id',session.user.id).single();if(error)return renderFatal(error.message);profile=p;if(!profile.is_approved)return renderFatal('Ожидается доступ: администратор должен включить is_approved для @'+profile.username);await renderDialogs();flushQueue()}
function renderLogin(msg=''){root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Вход</div><div class="muted">Закрытый мессенджер · стабильный MVP</div><input id="email" class="input" type="email" placeholder="email"><input id="password" class="input" type="password" placeholder="пароль"><button id="login" class="btn full">Войти</button><div id="err" class="error">${esc(msg)}</div><div class="small">stable-origin · realtime-v2</div></div>`;document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('err').textContent=error.message;boot()}}
function renderFatal(msg){root.innerHTML=`<div class="card"><div class="brand">VISION TALK</div><div class="title">Ошибка</div><div class="muted">${esc(msg)}</div><button class="btn full" id="out">Выйти</button></div>`;document.getElementById('out').onclick=async()=>{await sb.auth.signOut();renderLogin()}}
async function renderDialogs(){if(channel){await sb.removeChannel(channel);channel=null}root.innerHTML=`<div class="shell"><div class="top"><div><div class="brand">VISION TALK</div><h1>Диалоги</h1></div><div class="topRight"><span>@${esc(profile.username)}</span><span id="logout">Выйти</span></div></div><div class="compose"><input id="username" class="input" placeholder="username"><button id="start" class="btn plus">+</button></div><div id="startErr" class="error" style="padding:0 28px"></div><div id="dialogs"></div></div>`;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();session=null;renderLogin()};document.getElementById('start').onclick=async()=>{let u=document.getElementById('username').value.trim().replace(/^@/,'');if(!u)return;const {data,error}=await sb.rpc('start_direct_conversation',{target_username:u});if(error)return document.getElementById('startErr').textContent=error.message;openConversation(data,u)};await loadDialogs()}
async function loadDialogs(){const el=document.getElementById('dialogs');if(!el)return;const {data,error}=await sb.rpc('my_conversations');if(error){el.innerHTML=`<div class="error" style="padding:28px">${esc(error.message)}</div>`;return}if(!data?.length){el.innerHTML='<div class="empty">Диалогов пока нет.</div>';return}el.innerHTML=data.map(d=>`<div class="dialog" data-id="${d.id}" data-title="${esc(d.title||'Диалог')}"><div class="name">${esc(d.title||'Диалог')}</div><div class="preview">${esc(d.last_message||'')}</div></div>`).join('');el.querySelectorAll('.dialog').forEach(x=>x.onclick=()=>openConversation(x.dataset.id,x.dataset.title))}
async function openConversation(id,title){currentConversation={id,title};root.innerHTML=`<div class="shell"><div class="chatTop"><div id="back" class="back">‹</div><div><div class="chatTitle">${esc(title||'Диалог')}</div><div class="small">Vision talk · realtime-v2</div></div></div><div id="messages" class="messages"></div><div class="composer"><input id="message" class="input" placeholder="Сообщение"><button id="send" class="btn send">↑</button></div></div>`;document.getElementById('back').onclick=()=>{currentConversation=null;renderDialogs()};document.getElementById('send').onclick=sendCurrent;document.getElementById('message').addEventListener('keydown',e=>{if(e.key==='Enter')sendCurrent()});await loadMessages(currentConversation);subscribeMessages(id)}
async function loadMessages(conv){if(!conv||currentConversation?.id!==conv.id)return;const {data,error}=await sb.from('messages').select('id,client_message_id,conversation_id,server_seq,sender_id,body,created_at').eq('conversation_id',conv.id).order('server_seq',{ascending:true});const el=document.getElementById('messages');if(!el)return;if(error){el.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}renderMessageList(data||[])}
function renderMessageList(list){const el=document.getElementById('messages');if(!el)return;const seen=new Set();const unique=list.filter(m=>{const k=m.client_message_id||m.id;if(seen.has(k))return false;seen.add(k);return true});el.innerHTML=unique.map(m=>`<div class="row ${m.sender_id===session.user.id?'mine':''}"><div class="bubble">${esc(m.body)}<span class="seq">#${m.server_seq}</span></div></div>`).join('');window.scrollTo(0,document.body.scrollHeight)}
function subscribeMessages(cid){if(channel)sb.removeChannel(channel);channel=sb.channel('conversation:'+cid+'-'+uuid()).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},payload=>{if(currentConversation?.id===cid)loadMessages(currentConversation)}).subscribe(status=>{realtimeStatus=status;if(status==='SUBSCRIBED')showStatus('Realtime подключён','good');else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')showStatus('Realtime: '+status,'bad')})}
async function sendCurrent(){const input=document.getElementById('message');if(!input)return;const body=input.value.trim();if(!body)return;input.value='';const m={conversation_id:currentConversation.id,client_message_id:uuid(),body};if(!navigator.onLine){const q=queueGet();q.push(m);queuePut(q);showStatus('Нет сети · сообщение сохранено','bad');return}const {error}=await sb.rpc('send_message',{p_conversation_id:m.conversation_id,p_client_message_id:m.client_message_id,p_type:'text',p_body:m.body,p_attachment_path:null});if(error){const q=queueGet();q.push(m);queuePut(q);showStatus('Отправка отложена','bad');return}await loadMessages(currentConversation)}
sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='SIGNED_OUT')renderLogin()});
boot();
</script></body></html>
