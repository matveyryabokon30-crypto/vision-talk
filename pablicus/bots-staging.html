<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pablicus · Bot Core staging</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15171a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:white;border:1px solid #e1e3e8;border-radius:18px;padding:18px}h1,h2{margin:0 0 10px}h1{font-size:24px}h2{font-size:18px}.muted,small{color:#747b86}button,input,select{font:inherit}button{border:1px solid #d9dce3;background:#fff;border-radius:11px;padding:10px 13px;cursor:pointer}button.primary{background:#15171a;color:white}input,select{width:100%;border:1px solid #d9dce3;border-radius:11px;padding:11px;margin:6px 0 12px}.bot{display:block;width:100%;text-align:left;margin:8px 0}.bot strong,.bot small{display:block}.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:560px}.messages{height:430px;overflow:auto;background:#f7f8fa;border-radius:14px;padding:14px}.msg{max-width:80%;padding:10px 12px;border-radius:14px;background:white;border:1px solid #e4e6eb;margin:9px 0;white-space:pre-wrap}.msg.me{margin-left:auto;background:#ece8ff}.send{display:flex;gap:8px;margin-top:12px}.send input{margin:0}.error{color:#a32639}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.chat{min-height:480px}.messages{height:340px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Bot Core · staging</h1><div id="identity" class="muted">Проверка входа…</div></div><button id="reload">Обновить</button></div><p id="status" class="muted">Подключение…</p><div class="grid"><section class="card"><h2>Боты</h2><div id="bots"></div><hr><form id="create"><label>Название<input id="name" maxlength="80" required placeholder="Например, Запись"></label><label>Шаблон<select id="template"><option value="lead_capture">Заявка</option><option value="helpdesk">Справка</option></select></label><button class="primary">Создать бота</button></form></section><section id="chat" class="card chat" hidden><div><h2 id="chatTitle">Бот</h2><p class="muted">Изолированный стенд. Обычные чаты Pablicus не изменяются.</p></div><div id="messages" class="messages"></div><form id="send" class="send"><input id="message" maxlength="5000" placeholder="Сообщение…" autocomplete="off"><button class="primary">Отправить</button></form></section></div></main><script src="bots/config.js"></script><script type="module" src="bots/stage.mjs"></script></body></html>
