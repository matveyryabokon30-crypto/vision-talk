<div id="home">
 <header class="homeHeader"><picture class="wordmark"><source srcset="assets/wordmark-dark.png" media="(prefers-color-scheme: dark)"><img id="logo" src="assets/wordmark-light.png" alt="pablicus"></picture><button id="newChat" class="plain" aria-label="Новый разговор">✎</button></header>

 <nav id="mainNav" hidden aria-label="Главные разделы"><button data-page="chats" class="selected"><span>▢</span>Чаты</button><button data-page="feed"><span>≋</span>Лента</button><button data-page="tasks"><span>✓</span>Дела</button><button data-page="profile"><span>♙</span>Профиль</button></nav>
</div>
<div id="toast" role="status" hidden></div><div id="updateNotice" hidden><span>Доступно обновление</span><button id="applyUpdate">Сохранить и обновить</button></div>
